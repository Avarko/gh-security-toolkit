services:
  # LocalStack writes its own state inside the container; local development only.
  localstack:  # nosemgrep: yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service
    # 4.14.0 is the last LocalStack image that runs without an account: from
    # 2026.x on, :latest exits 55 unless LOCALSTACK_AUTH_TOKEN is set. It gets no
    # more updates, which is acceptable for a local S3 bound to this machine.
    image: localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
    ports:
      - "127.0.0.1:4566:4566"  # LocalStack Gateway, this machine only
    environment:
      - SERVICES=s3
      - DEBUG=0
      - PERSISTENCE=1
      - LOCALSTACK_HOST=localhost
    volumes:
      # No Docker socket: only S3 runs here, and S3 starts no containers.
      - localstack_data:/var/lib/localstack
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  localstack_data:
