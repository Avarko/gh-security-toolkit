name: "Security scan"
description: |
  Composite action for running security scans on filesystem and/or Docker images.
  Unlike the previous reusable workflow, this action runs in the same job as the caller,
  eliminating the need for artifact uploads/downloads.

  The caller workflow must:
  - Build the Docker image (if scanning images)
  - Have the filesystem available (if scanning filesystem)
  - Set appropriate permissions (contents: write, pages: write, id-token: write, actions: read)
  - Handle concurrency if needed

inputs:
  # === SCAN TARGETS ===
  filesystem_paths:
    description: |
      Newline-separated list of paths to scan (optional).
      Each path can be a file or directory. Paths are copied to a temporary
      scan root preserving directory structure.
      Example:
        filesystem_paths: |
          backend/target/
          backend/pom.xml
          frontend/package.json
          Dockerfile
    required: false
    default: ""

  docker_image_ref:
    description: "Docker image reference (name:tag) to scan (optional). The image must already exist in the local Docker daemon."
    required: false
    default: ""

  # === TRIVY CONFIGURATION ===
  trivy_config:
    description: "Path to .trivy.yaml config file (optional)"
    required: false
    default: ""

  trivy_severity:
    description: "Minimum severity to report (UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL)"
    required: false
    default: "MEDIUM,HIGH,CRITICAL"

  # === SEMGREP CONFIGURATION ===
  semgrep_configs:
    description: "Semgrep rule configurations to use (comma-separated)"
    required: false
    default: "p/owasp-top-ten,p/java,p/javascript,p/dockerfile,p/terraform,p/secrets"

  # === RELEASE NOTES ===
  release_notes_maxlength:
    description: "Maximum length of release notes body (characters). GitHub limit is 125000."
    required: false
    default: "30000"

  # === PUBLISHING ===
  publish_to:
    description: 'Where to publish results: "github-release", "github-pages", or "github-release,github-pages" for both'
    required: false
    default: "github-pages"

  # === METADATA FOR REPORTING ===
  channel:
    description: "Channel name for release grouping (tag-friendly, e.g., 'master', 'dev', 'prod'). Used in tags and release retention."
    required: true

  # === RETENTION (for github-release) ===
  retention_keep:
    description: "Number of releases to keep per channel"
    required: false
    default: "10"

  retention_days:
    description: "Days to keep releases"
    required: false
    default: "30"

  # === GITHUB TOKEN ===
  github_token:
    description: "GitHub token for API operations (defaults to github.token)"
    required: false
    default: ${{ github.token }}

outputs:
  trivy_fs_json:
    description: "Path to Trivy filesystem scan JSON results"
    value: ${{ steps.trivy.outputs.fs_json }}
  trivy_image_json:
    description: "Path to Trivy image scan JSON results"
    value: ${{ steps.trivy.outputs.image_json }}
  semgrep_summary:
    description: "Path to Semgrep summary"
    value: ${{ steps.semgrep.outputs.semgrep_summary }}
  release_body_markdown:
    description: "Path to release body markdown file"
    value: ${{ steps.sum.outputs.release_body_markdown }}
  output_dir:
    description: "Directory containing all scan outputs"
    value: ${{ steps.setup.outputs.output_dir }}
  filesystem_scan_root:
    description: "Directory containing merged filesystem paths for scanning (if filesystem_paths was provided)"
    value: ${{ steps.fsroot.outputs.scan_root }}

runs:
  using: "composite"
  steps:
    - name: Setup directories
      id: setup
      shell: bash
      run: |
        # Use unique directory to avoid collisions when action is called multiple times
        OUTPUT_DIR="${RUNNER_TEMP}/security-scan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        mkdir -p "$OUTPUT_DIR"
        echo "output_dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"

    - name: Timestamp
      id: ts
      shell: bash
      run: |
        # ISO 8601 timestamp for scan identification
        echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

    - name: Validate channel name
      shell: bash
      run: |
        CHANNEL="${{ inputs.channel }}"

        # Check if empty
        if [ -z "$CHANNEL" ]; then
          echo "Error: channel is required but empty"
          exit 1
        fi

        # Check length (max 35 characters)
        if [ ${#CHANNEL} -gt 35 ]; then
          echo "Error: channel name too long (max 35 characters): '$CHANNEL'"
          exit 1
        fi

        # Check for invalid characters (only allow: a-z, A-Z, 0-9, dash, underscore)
        if ! echo "$CHANNEL" | grep -qE '^[a-zA-Z0-9_-]+$'; then
          echo "Error: channel contains invalid characters: '$CHANNEL'"
          echo "   Allowed: a-z, A-Z, 0-9, dash (-), underscore (_)"
          exit 1
        fi

        # Check it doesn't start/end with dash or underscore
        if echo "$CHANNEL" | grep -qE '^[-_]|[-_]$'; then
          echo "Error: channel cannot start or end with dash/underscore: '$CHANNEL'"
          exit 1
        fi

        echo "Channel name is valid: '$CHANNEL'"

    - name: Create scan context metadata
      shell: bash
      run: |
        cat > "${{ steps.setup.outputs.output_dir }}/scan-context.json" << EOF
        {
          "channel": "${{ inputs.channel }}",
          "timestamp": "$(date -u +'%Y-%m-%d-%H%M%SZ')",
          "branch": "${GITHUB_REF_NAME:-}",
          "repository": "${GITHUB_REPOSITORY:-}",
          "commitSha": "${GITHUB_SHA:-}",
          "scanId": "${GITHUB_RUN_ID:-}",
          "ciJobName": "${GITHUB_WORKFLOW:-}",
          "ciJobUrl": "${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
          "actorName": "${GITHUB_ACTOR:-}"
        }
        EOF
        echo "Created scan-context.json:"
        cat "${{ steps.setup.outputs.output_dir }}/scan-context.json"

    # === BUILD FILESYSTEM SCAN ROOT ===
    - name: Build filesystem scan root
      id: fsroot
      if: ${{ inputs.filesystem_paths != '' }}
      shell: bash
      run: |
        set -euo pipefail

        ROOT="${RUNNER_TEMP}/trivy-fs-root-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        mkdir -p "$ROOT"

        PATHS="${{ inputs.filesystem_paths }}"

        echo "📁 Building filesystem scan root at: $ROOT"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

        # Count for summary
        VALID_COUNT=0
        INVALID_COUNT=0
        INVALID_PATHS=""

        # Process newline-separated paths
        while IFS= read -r path || [ -n "$path" ]; do
          # Skip empty lines and comments
          [ -z "$path" ] && continue
          [[ "$path" =~ ^[[:space:]]*# ]] && continue

          # Trim whitespace
          path="${path#"${path%%[![:space:]]*}"}"   # trim left
          path="${path%"${path##*[![:space:]]}"}"   # trim right
          [ -z "$path" ] && continue

          # Security: reject absolute paths (must be relative to workspace)
          if [[ "$path" = /* ]]; then
            echo "❌ REJECTED (absolute path not allowed): '$path'"
            INVALID_COUNT=$((INVALID_COUNT + 1))
            INVALID_PATHS="${INVALID_PATHS}\n  - $path (absolute path)"
            continue
          fi

          # Security: reject path traversal attempts
          if [[ "$path" =~ \.\. ]]; then
            echo "❌ REJECTED (path traversal not allowed): '$path'"
            INVALID_COUNT=$(  (INVALID_COUNT + 1))
            INVALID_PATHS="${INVALID_PATHS}\n  - $path (path traversal)"
            continue
          fi

          # Security: reject paths with shell metacharacters
          if [[ "$path" =~ [\;\|\&\$\`\(\)\{\}\[\]\<\>\!\*\?] ]]; then
            echo "❌ REJECTED (invalid characters): '$path'"
            INVALID_COUNT=$((INVALID_COUNT + 1))
            INVALID_PATHS="${INVALID_PATHS}\n  - $path (invalid characters)"
            continue
          fi

          # Validate: check path exists
          if [ ! -e "$path" ]; then
            echo "❌ REJECTED (path not found): '$path'"
            INVALID_COUNT=$((INVALID_COUNT + 1))
            INVALID_PATHS="${INVALID_PATHS}\n  - $path (not found)"
            continue
          fi

          # Copy with rsync preserving relative path structure
          echo "✅ Adding: '$path'"
          rsync -a --relative "$path" "$ROOT/"
          VALID_COUNT=$((VALID_COUNT + 1))
        done <<< "$PATHS"

        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "📊 Summary: $VALID_COUNT valid paths, $INVALID_COUNT rejected"

        # Fail fast if any paths were invalid
        if [ "$INVALID_COUNT" -gt 0 ]; then
          echo ""
          echo "❌ ERROR: $INVALID_COUNT path(s) failed validation:${INVALID_PATHS}"
          echo ""
          echo "Please fix the filesystem_paths input and retry."
          exit 1
        fi

        # Fail if no valid paths were found
        if [ "$VALID_COUNT" -eq 0 ]; then
          echo ""
          echo "❌ ERROR: No valid paths found in filesystem_paths input."
          echo "   Provided input was:"
          echo "$PATHS" | head -20
          exit 1
        fi

        # Show what was copied
        echo ""
        echo "📦 File type summary:"
        FILE_LIST="$ROOT/.filelist"
        if ! find "$ROOT" -type f > "$FILE_LIST"; then
          echo "  (find failed, skipping summary)"
        else
          if [ ! -s "$FILE_LIST" ]; then
            echo "  (no files found)"
          else
            declare -A ext_counts=()
            while IFS= read -r f; do
              filename=${f##*/}        # basename
              ext=${filename##*.}

              if [ "$filename" = "$ext" ]; then
                ext="(none)"
              fi
              if [[ -v "ext_counts[$ext]" ]]; then
                ext_counts["$ext"]=$(( ext_counts["$ext"] + 1 ))
              else
                ext_counts["$ext"]=1
              fi
            done < "$FILE_LIST"
            total=0
            for ext in "${!ext_counts[@]}"; do
              count=${ext_counts[$ext]}
              printf "  %-10s %6d files\n" "$ext" "$count"
              total=$(( total + count ))
            done
            echo "  --------------------------"
            echo "  Total files: $total"
          fi
        fi
        echo "scan_root=$ROOT" >> "$GITHUB_OUTPUT"
        echo "has_fs_scan=true" >> "$GITHUB_OUTPUT"

    # === RUN TRIVY SCANS ===
    - name: Run Trivy scans
      id: trivy
      uses: Avarko/gh-security-toolkit/actions/scanner/trivy@reactui
      with:
        filesystem_path: ${{ steps.fsroot.outputs.scan_root || '' }}
        docker_image_ref: ${{ inputs.docker_image_ref }}
        trivy_config: ${{ inputs.trivy_config }}
        trivy_severity: ${{ inputs.trivy_severity }}
        trivy_output_dir: ${{ steps.setup.outputs.output_dir }}

    # === RUN SEMGREP SCAN ===
    - name: Run Semgrep scan
      id: semgrep
      if: ${{ steps.fsroot.outputs.has_fs_scan == 'true' }}
      uses: Avarko/gh-security-toolkit/actions/scanner/semgrep@reactui
      with:
        filesystem_path: ${{ steps.fsroot.outputs.scan_root }}
        semgrep_output_dir: ${{ steps.setup.outputs.output_dir }}
        semgrep_configs: ${{ inputs.semgrep_configs }}

    # === SUMMARIZE RESULTS ===
    - name: Summarizer
      id: sum
      uses: Avarko/gh-security-toolkit/actions/summarizer@reactui
      with:
        fs_json: ${{ steps.trivy.outputs.fs_json || '' }}
        image_json: ${{ steps.trivy.outputs.image_json || '' }}
        semgrep_summary: ${{ steps.semgrep.outputs.semgrep_summary || '' }}
        dependabot_summary: ""
        outdir: ${{ steps.setup.outputs.output_dir }}
        maxlength: ${{ inputs.release_notes_maxlength }}
        title_vuln_fs: "Trivy (filesystem) vulnerability summary"
        title_mis_fs: "Trivy (filesystem) misconfiguration summary"
        title_vuln_img: "Trivy (image) vulnerability summary"
        title_mis_img: "Trivy (image) misconfiguration summary"

    # === PUBLISH TO GITHUB RELEASE ===
    - name: Publish to GitHub Release
      if: ${{ contains(inputs.publish_to, 'github-release') }}
      uses: Avarko/gh-security-toolkit/actions/publisher/github-release@reactui
      with:
        outdir: ${{ steps.setup.outputs.output_dir }}
        release_name: "Security scan ${{ inputs.channel }} ${{ steps.ts.outputs.ts }}"
        tag_name: "security-scan-${{ inputs.channel }}-${{ steps.ts.outputs.ts }}"
        body_file: ${{ steps.sum.outputs.release_body_markdown }}
        draft: "false"
        prerelease: "true"
        overwrite_tag: "false"
        channel: "security-scan-${{ inputs.channel }}"
        retention_keep: ${{ inputs.retention_keep }}
        retention_days: ${{ inputs.retention_days }}
        github_token: ${{ inputs.github_token }}

    # === PUBLISH TO GITHUB PAGES ===
    - name: Publish to GitHub Pages
      if: ${{ contains(inputs.publish_to, 'github-pages') }}
      id: pages
      uses: Avarko/gh-security-toolkit/actions/publisher/github-pages@reactui
      with:
        github_token: ${{ inputs.github_token }}
        outdir: ${{ steps.setup.outputs.output_dir }}
