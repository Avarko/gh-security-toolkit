name: "Trivy scanner"
description: "Runs Trivy scans on filesystem and/or Docker image"
inputs:
  filesystem_path:
    description: "Path to filesystem to scan (optional)"
    required: false
    default: ""
  docker_image_ref:
    description: "Docker image reference (name:tag or ID) to scan (optional). The image must already exist in the local Docker daemon."
    required: false
    default: ""
  trivy_config:
    description: "Path to .trivy.yaml config file"
    required: false
    default: ""
  trivy_severity:
    description: "Severity levels to report"
    required: false
    default: "MEDIUM,HIGH,CRITICAL"
  trivy_output_dir:
    description: "Directory for Trivy JSON outputs"
    required: true
runs:
  using: "composite"
  steps:
    - name: Prepare output directory
      shell: bash
      run: mkdir -p "${{ inputs.trivy_output_dir }}"

    - name: Trivy cache
      continue-on-error: true
      uses: yogeshlonkar/trivy-cache-action@ed5a0132284e2c2d52921949acf5753cce4b6a2b  # v0.1.17
      with:
        gh-token: ${{ github.token }}

    - name: Trivy - Filesystem scan
      id: fs_scan
      if: ${{ inputs.filesystem_path != '' }}
      continue-on-error: true
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
      with:
        version: 'v0.69.3'
        scan-type: 'fs'
        scan-ref: ${{ inputs.filesystem_path }}
        format: json
        output: ${{ inputs.trivy_output_dir }}/trivy-fs-results.json
        exit-code: 0
        severity: ${{ inputs.trivy_severity }}
        trivy-config: ${{ inputs.trivy_config }}
        cache-dir: .trivy
        timeout: 10m
        scanners: vuln,misconfig

    - name: Trivy - Image scan
      id: image_scan
      if: ${{ inputs.docker_image_ref != '' }}
      continue-on-error: true
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
      with:
        version: 'v0.69.3'
        image-ref: ${{ inputs.docker_image_ref }}
        format: json
        output: ${{ inputs.trivy_output_dir }}/trivy-image-results.json
        exit-code: 0
        severity: ${{ inputs.trivy_severity }}
        trivy-config: ${{ inputs.trivy_config }}
        cache-dir: .trivy
        timeout: 15m
        scanners: vuln

    - name: Report scan status
      shell: bash
      run: |
        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "📊 Trivy scan status report"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

        FS_REQUESTED="${{ inputs.filesystem_path != '' }}"
        IMAGE_REQUESTED="${{ inputs.docker_image_ref != '' }}"
        FS_OUTCOME="${{ steps.fs_scan.outcome }}"
        IMAGE_OUTCOME="${{ steps.image_scan.outcome }}"

        # Filesystem scan status
        if [ "$FS_REQUESTED" = "true" ]; then
          if [ -f "${{ inputs.trivy_output_dir }}/trivy-fs-results.json" ]; then
            echo "✅ Filesystem scan: completed successfully"
          elif [ "$FS_OUTCOME" = "failure" ]; then
            echo "❌ Filesystem scan: FAILED (check logs above for details)"
            echo "   Path: ${{ inputs.filesystem_path }}"
          elif [ "$FS_OUTCOME" = "skipped" ]; then
            echo "⏭️  Filesystem scan: skipped"
          else
            echo "⚠️  Filesystem scan: unknown status ($FS_OUTCOME)"
          fi
        else
          echo "⏭️  Filesystem scan: not requested"
        fi

        # Image scan status
        if [ "$IMAGE_REQUESTED" = "true" ]; then
          if [ -f "${{ inputs.trivy_output_dir }}/trivy-image-results.json" ]; then
            echo "✅ Image scan: completed successfully"
          elif [ "$IMAGE_OUTCOME" = "failure" ]; then
            echo "❌ Image scan: FAILED (check logs above for details)"
            echo "   Image: ${{ inputs.docker_image_ref }}"
          elif [ "$IMAGE_OUTCOME" = "skipped" ]; then
            echo "⏭️  Image scan: skipped"
          else
            echo "⚠️  Image scan: unknown status ($IMAGE_OUTCOME)"
          fi
        else
          echo "⏭️  Image scan: not requested"
        fi

        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo ""

    - name: Set outputs
      id: outputs
      shell: bash
      run: |
        if [ -f "${{ inputs.trivy_output_dir }}/trivy-fs-results.json" ]; then
          echo "fs_json=${{ inputs.trivy_output_dir }}/trivy-fs-results.json" >> "$GITHUB_OUTPUT"
        fi
        if [ -f "${{ inputs.trivy_output_dir }}/trivy-image-results.json" ]; then
          echo "image_json=${{ inputs.trivy_output_dir }}/trivy-image-results.json" >> "$GITHUB_OUTPUT"
        fi

    - name: Get Trivy version
      id: version
      shell: bash
      run: |
        if [ -n "${{ inputs.filesystem_path }}" ] || [ -n "${{ inputs.docker_image_ref }}" ]; then
          TRIVY_VERSION=$(trivy --version | head -n1 | awk '{print $2}')
          echo "trivy_version=$TRIVY_VERSION" >> "$GITHUB_OUTPUT"
          echo "Trivy version: $TRIVY_VERSION"
        else
          echo "trivy_version=not_installed" >> "$GITHUB_OUTPUT"
          echo "Trivy version: Not installed; no scan performed, because no filesystem or Docker image input provided"
        fi

outputs:
  fs_json:
    description: "Filesystem scan JSON path (if performed)"
    value: ${{ steps.outputs.outputs.fs_json }}
  image_json:
    description: "Image scan JSON path (if performed)"
    value: ${{ steps.outputs.outputs.image_json }}
  trivy_version:
    description: "Trivy version"
    value: ${{ steps.version.outputs.trivy_version }}
