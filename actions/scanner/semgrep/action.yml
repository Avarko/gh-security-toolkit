name: "Semgrep Scanner"
description: "Runs Semgrep static analysis scans on source code"
inputs:
  filesystem_path:
    description: "Path to source code to scan"
    required: true
  semgrep_output_dir:
    description: "Directory for Semgrep JSON output"
    required: true
  semgrep_configs:
    description: "Semgrep rulesets to use (comma-separated)"
    required: false
    default: "p/owasp-top-ten,p/cwe-top-25,p/java,p/javascript,p/docker-compose,p/dockerfile,p/terraform,p/secrets"
runs:
  using: "composite"
  steps:
    - name: Prepare output directory
      shell: bash
      run: mkdir -p "${{ inputs.semgrep_output_dir }}"

    # Pinned, because this installs on the consumer's runner with the
    # consumer's token in the environment. It read "pip3 install semgrep",
    # which resolved to whatever PyPI served that minute -- the same shape as
    # the curl-into-bash that used to hide behind a SHA-pinned setup-jbang,
    # and no better for being spelled in Python.
    #
    # The version matches SEMGREP_VERSION in Makefile.scanners so that a local
    # scan and a CI scan run the same Semgrep on the same code and agree about
    # what they found. scripts/check-semgrep-config.py fails the build if they
    # drift. The pip upgrade that used to run first is gone: it mutated the
    # runner's global pip to no purpose here.
    - name: Setup Semgrep
      shell: bash
      run: pip3 install --disable-pip-version-check semgrep==1.176.1

    # --no-git-ignore is gone, and so is the .semgrepignore this step used to
    # write into the consumer's checkout. That file was a hand-maintained list
    # of node_modules, dist, target and the rest -- clobbering whatever the
    # repository had there, which the README documents as a supported way to
    # configure a scan. It was also unnecessary: Semgrep skips those
    # directories on its own. Checked, on a tree with no .gitignore and no
    # .semgrepignore at all, Semgrep scanned src/f.js and left node_modules
    # and dist alone.
    #
    # Dropping both means CI now honours .gitignore and any .semgrepignore the
    # repository actually has, which is what the local scan has always done.
    - name: Run Semgrep scan (JSON for parsing)
      shell: bash
      working-directory: ${{ inputs.filesystem_path }}
      env:
        INPUT_SEMGREP_CONFIGS: ${{ inputs.semgrep_configs }}
        INPUT_SEMGREP_OUTPUT_DIR: ${{ inputs.semgrep_output_dir }}
      run: |
        set -euo pipefail

        # Built as an array so a ruleset name is one argument whatever it
        # contains, rather than whatever word splitting makes of it.
        #
        # Expanded as ${a[@]+"${a[@]}"} rather than "${a[@]}", which is not
        # decoration: under set -u an empty array is an unbound variable on
        # bash before 4.4, and the runners this can land on include macOS,
        # where /bin/bash is still 3.2. Verified on both -- 3.2 aborts with
        # "CONFIG_ARRAY[@]: unbound variable" on the plain form and is fine on
        # this one.
        CONFIG_FLAGS=()
        IFS=',' read -ra CONFIG_ARRAY <<< "${INPUT_SEMGREP_CONFIGS}"
        for cfg in ${CONFIG_ARRAY[@]+"${CONFIG_ARRAY[@]}"}; do
          trimmed="$(echo "$cfg" | tr -d '[:space:]')"
          [ -n "$trimmed" ] && CONFIG_FLAGS+=(--config "$trimmed")
        done

        # An empty list is refused rather than passed on. Semgrep with no
        # --config scans with no rules and reports nothing, which is the same
        # false clean the .errors check below exists to prevent, arrived at
        # from the other end. A client config with an empty
        # scanning.semgrep.configs reaches here as an empty string.
        if [ ${#CONFIG_FLAGS[@]} -eq 0 ]; then
          echo "::error::No Semgrep rulesets configured, so there is nothing to scan for." >&2
          exit 1
        fi

        echo "Running Semgrep ${CONFIG_FLAGS[*]}"

        # No "|| true". Semgrep exits 0 whether or not it found anything and
        # 2 or more when it could not run, so swallowing that turned a scan
        # that never happened into a scan that found nothing.
        rc=0
        semgrep scan \
          "${CONFIG_FLAGS[@]}" \
          --json \
          --quiet \
          --metrics=off \
          . > "${INPUT_SEMGREP_OUTPUT_DIR}/semgrep-results.json" || rc=$?

        if [ "$rc" -ne 0 ]; then
          echo "::error::Semgrep exited $rc; no usable results were produced." >&2
          exit "$rc"
        fi

        # A zero exit is not enough on its own. Semgrep reports a ruleset it
        # could not load in .errors[] and still writes a well-formed file with
        # an empty .results[], which reads downstream as a clean scan.
        #
        # A missing .errors needs no guard, though review read it as one that
        # does: in jq "null | length" is 0, not null, so output with no errors
        # key counts as zero errors and passes. Checked against
        # scripts/test-fixtures/semgrep-results.json, which has no errors key.
        ERRORS=$(jq '.errors | length' "${INPUT_SEMGREP_OUTPUT_DIR}/semgrep-results.json")
        if [ "$ERRORS" -gt 0 ]; then
          echo "::error::Semgrep reported $ERRORS error(s); the findings below would be incomplete." >&2
          jq -r '.errors[] | "  - " + (.message // .type // "unknown")' \
            "${INPUT_SEMGREP_OUTPUT_DIR}/semgrep-results.json" >&2
          exit 1
        fi

        echo "Semgrep JSON scan completed"

    # Best-effort, unlike the run above: this one only renders what the JSON
    # already established, so a failure here costs a nicer report and not the
    # result. Semgrep cannot write two formats in one run -- "--output cannot
    # be repeated" -- which is why the scan happens twice.
    - name: Run Semgrep scan (text for full report)
      shell: bash
      working-directory: ${{ inputs.filesystem_path }}
      env:
        INPUT_SEMGREP_CONFIGS: ${{ inputs.semgrep_configs }}
        INPUT_SEMGREP_OUTPUT_DIR: ${{ inputs.semgrep_output_dir }}
      run: |
        CONFIG_FLAGS=()
        IFS=',' read -ra CONFIG_ARRAY <<< "${INPUT_SEMGREP_CONFIGS}"
        for cfg in ${CONFIG_ARRAY[@]+"${CONFIG_ARRAY[@]}"}; do
          trimmed="$(echo "$cfg" | tr -d '[:space:]')"
          [ -n "$trimmed" ] && CONFIG_FLAGS+=(--config "$trimmed")
        done

        semgrep scan \
          "${CONFIG_FLAGS[@]}" \
          --metrics=off \
          . > "${INPUT_SEMGREP_OUTPUT_DIR}/semgrep-full-report.txt" 2>&1 || true

    - name: Create full report markdown
      shell: bash
      env:
        INPUT_SEMGREP_OUTPUT_DIR: ${{ inputs.semgrep_output_dir }}
      run: |
        FULL_REPORT="${INPUT_SEMGREP_OUTPUT_DIR}/semgrep-full-report.md"

        echo "# Semgrep SAST Full Report" > "$FULL_REPORT"
        echo "" >> "$FULL_REPORT"
        echo '```' >> "$FULL_REPORT"
        cat "${INPUT_SEMGREP_OUTPUT_DIR}/semgrep-full-report.txt" >> "$FULL_REPORT"
        echo '```' >> "$FULL_REPORT"

    - name: Create summary markdown (top 10)
      id: summary
      shell: bash
      env:
        INPUT_SEMGREP_OUTPUT_DIR: ${{ inputs.semgrep_output_dir }}
      run: |
        OUTPUT_FILE="${INPUT_SEMGREP_OUTPUT_DIR}/SEMGREP_SUMMARY.md"
        JSON_FILE="${INPUT_SEMGREP_OUTPUT_DIR}/semgrep-results.json"

        echo "## 🔍 Semgrep SAST Scan Results" > "$OUTPUT_FILE"
        echo "" >> "$OUTPUT_FILE"

        if [ ! -f "$JSON_FILE" ]; then
          echo "⚠️ No Semgrep results available." >> "$OUTPUT_FILE"
          echo "semgrep_summary=$OUTPUT_FILE" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Validate JSON
        if ! jq empty "$JSON_FILE" 2>/dev/null; then
          echo "⚠️ Invalid Semgrep JSON output. Check semgrep-results.json for details." >> "$OUTPUT_FILE"
          echo "semgrep_summary=$OUTPUT_FILE" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Count findings by severity
        TOTAL=$(jq '.results | length' "$JSON_FILE" 2>/dev/null || echo "0")
        ERRORS=$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' "$JSON_FILE" 2>/dev/null || echo "0")
        WARNINGS=$(jq '[.results[] | select(.extra.severity == "WARNING")] | length' "$JSON_FILE" 2>/dev/null || echo "0")
        INFO=$(jq '[.results[] | select(.extra.severity == "INFO")] | length' "$JSON_FILE" 2>/dev/null || echo "0")

        echo "**Summary:** $TOTAL findings ($ERRORS errors, $WARNINGS warnings, $INFO info)" >> "$OUTPUT_FILE"
        echo "" >> "$OUTPUT_FILE"

        if [ "$TOTAL" -eq 0 ]; then
          echo "✅ No issues found!" >> "$OUTPUT_FILE"
          echo "semgrep_summary=$OUTPUT_FILE" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Extract top 10 findings (errors first, then by severity)
        echo "**Top 10 findings:**" >> "$OUTPUT_FILE"
        echo "" >> "$OUTPUT_FILE"

        jq -r '[.results[] | {
          severity: .extra.severity,
          check_id: .check_id,
          message: .extra.message,
          path: .path,
          line: .start.line
        }] |
        sort_by(
          if .severity == "ERROR" then 0
          elif .severity == "WARNING" then 1
          else 2 end
        ) |
        .[:10] |
        .[] |
        "### \(.severity): \(.check_id)\n- **File:** `\(.path):\(.line)`\n- **Message:** \(.message)\n"' "$JSON_FILE" >> "$OUTPUT_FILE"

        echo "" >> "$OUTPUT_FILE"

        # Show remaining count if more than 10
        if [ "$TOTAL" -gt 10 ]; then
          REMAINING=$((TOTAL - 10))
          echo "**... and $REMAINING more findings**" >> "$OUTPUT_FILE"
          echo "" >> "$OUTPUT_FILE"
        fi

        echo "📄 [View full Semgrep report](semgrep-full-report.md)" >> "$OUTPUT_FILE"

        echo "semgrep_summary=$OUTPUT_FILE" >> "$GITHUB_OUTPUT"
        echo "Semgrep summary created at $OUTPUT_FILE"

    - name: Get Semgrep version
      id: version
      shell: bash
      run: |
        SEMGREP_VERSION=$(semgrep --version | head -n1 | awk '{print $1}')
        echo "semgrep_version=$SEMGREP_VERSION" >> "$GITHUB_OUTPUT"
        echo "Semgrep version: $SEMGREP_VERSION"

outputs:
  semgrep_summary:
    description: "Semgrep summary markdown file path"
    value: ${{ steps.summary.outputs.semgrep_summary }}
  semgrep_version:
    description: "Semgrep version"
    value: ${{ steps.version.outputs.semgrep_version }}
