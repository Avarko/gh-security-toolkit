name: "TruffleHog Scanner"
description: "Lightweight wrapper for TruffleHog to scan Git repositories for leaked credentials and secrets. Suitable for PR checks and pre-commit hooks."

inputs:
  path:
    description: "Path to Git repository or directory to scan"
    required: false
    default: "."

  base:
    description: "Base commit/branch to scan from (for incremental scans, e.g., 'main' or commit SHA)"
    required: false
    default: ""

  head:
    description: "Head commit/branch to scan to (defaults to current HEAD)"
    required: false
    default: "HEAD"

  scan_type:
    description: "Scan type: 'git' (git history), 'filesystem' (current files only), or 'auto' (detect)"
    required: false
    default: "auto"

  only_verified:
    description: "Only show verified secrets (true/false)"
    required: false
    default: "false"

  fail_on_findings:
    description: "Fail the workflow if secrets are found (true/false)"
    required: false
    default: "true"

  extra_args:
    description: "Additional arguments to pass to TruffleHog CLI"
    required: false
    default: ""

outputs:
  findings_count:
    description: "Number of secrets found"
    value: ${{ steps.scan.outputs.findings_count }}

  has_verified:
    description: "Whether verified secrets were found (true/false)"
    value: ${{ steps.scan.outputs.has_verified }}

runs:
  using: "composite"
  steps:
    - name: Determine scan configuration
      id: config
      shell: bash
      # Values arrive as environment variables, never interpolated into the
      # script text. A ${{ }} expression is substituted before bash parses the
      # line, so a value containing a quote escapes its own assignment and the
      # rest of it is executed as script. Branch names reach this action, and
      # on a fork pull request the branch name is chosen by the attacker.
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_SCAN_TYPE: ${{ inputs.scan_type }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_HEAD: ${{ inputs.head }}
        INPUT_ONLY_VERIFIED: ${{ inputs.only_verified }}
      run: |
        SCAN_PATH="$INPUT_PATH"
        SCAN_TYPE="$INPUT_SCAN_TYPE"

        # Auto-detect scan type
        if [ "$SCAN_TYPE" = "auto" ]; then
          if [ -d "$SCAN_PATH/.git" ]; then
            SCAN_TYPE="git"
            echo "ℹ️  Auto-detected: Git repository scan"
          else
            SCAN_TYPE="filesystem"
            echo "ℹ️  Auto-detected: Filesystem scan"
          fi
        fi

        echo "scan_type=$SCAN_TYPE" >> "$GITHUB_OUTPUT"

        # Determine if this is an incremental scan
        if [ -n "$INPUT_BASE" ] && [ "$SCAN_TYPE" = "git" ]; then
          echo "incremental=true" >> "$GITHUB_OUTPUT"
          echo "📈 Incremental scan: ${INPUT_BASE}..${INPUT_HEAD}"
        else
          echo "incremental=false" >> "$GITHUB_OUTPUT"
          if [ "$SCAN_TYPE" = "git" ]; then
            echo "📜 Full Git history scan"
          else
            echo "📁 Filesystem scan (current files only)"
          fi
        fi

        # Build results filter
        if [ "$INPUT_ONLY_VERIFIED" = "true" ]; then
          echo "results_filter=verified" >> "$GITHUB_OUTPUT"
          echo "🔍 Filter: Verified secrets only"
        else
          echo "results_filter=verified,unknown" >> "$GITHUB_OUTPUT"
          echo "🔍 Filter: Verified + Unknown"
        fi

    - name: Run TruffleHog scan
      id: scan
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        SCAN_TYPE: ${{ steps.config.outputs.scan_type }}
        RESULTS_FILTER: ${{ steps.config.outputs.results_filter }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_HEAD: ${{ inputs.head }}
        INPUT_EXTRA_ARGS: ${{ inputs.extra_args }}
        INPUT_FAIL_ON_FINDINGS: ${{ inputs.fail_on_findings }}
      run: |
        set +e  # Don't exit on TruffleHog findings

        # The command is built as an array and executed directly. It used to be
        # assembled into a string and run through eval, which re-parsed every
        # value it contained as shell: a base or head of `main;id` was two
        # commands by the time it ran. An array element is one argument no
        # matter what is in it.
        cmd=(trufflehog)
        if [ "$SCAN_TYPE" = "git" ]; then
          cmd+=(git file://.)
          if [ -n "$INPUT_BASE" ]; then
            cmd+=("--since-commit=$INPUT_BASE")
          fi
          cmd+=("--branch=$INPUT_HEAD")
        else
          cmd+=(filesystem .)
        fi
        cmd+=(--json "--results=$RESULTS_FILTER")

        # extra_args is documented as a free-form CLI string, so it has to be
        # split into words -- but with read -a rather than by the shell, so the
        # words are only ever arguments. No globbing, no substitution, no
        # metacharacters: `; rm -rf /` becomes four harmless arguments that
        # TruffleHog rejects.
        if [ -n "$INPUT_EXTRA_ARGS" ]; then
          read -r -a extra_args <<< "$INPUT_EXTRA_ARGS"
          cmd+=("${extra_args[@]}")
        fi

        echo "Running TruffleHog..."
        printf 'Command:'; printf ' %q' "${cmd[@]}"; printf '\n'

        # Run scan and capture output (use namespaced temp file to avoid collisions)
        TEMP_OUTPUT="${RUNNER_TEMP}/trufflehog-output-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
        "${cmd[@]}" > "$TEMP_OUTPUT" 2>&1
        EXIT_CODE=$?

        # Count findings
        FINDINGS_COUNT=0
        VERIFIED_COUNT=0

        if [ -f "$TEMP_OUTPUT" ]; then
          # Count total findings (JSON lines)
          FINDINGS_COUNT=$(grep -c '{"SourceMetadata"' "$TEMP_OUTPUT" 2>/dev/null || echo "0")

          # Count verified findings
          VERIFIED_COUNT=$(grep '"Verified":true' "$TEMP_OUTPUT" 2>/dev/null | wc -l || echo "0")

          # Show findings in output
          if [ "$FINDINGS_COUNT" -gt 0 ]; then
            echo ""
            echo "⚠️  Found $FINDINGS_COUNT potential secret(s) ($VERIFIED_COUNT verified)"
            echo ""
            cat "$TEMP_OUTPUT"
          else
            echo "✅ No secrets found"
          fi
        fi

        # Set outputs
        echo "findings_count=$FINDINGS_COUNT" >> "$GITHUB_OUTPUT"

        if [ "$VERIFIED_COUNT" -gt 0 ]; then
          echo "has_verified=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_verified=false" >> "$GITHUB_OUTPUT"
        fi

        # Cleanup
        rm -f "$TEMP_OUTPUT"

        # Exit with appropriate code
        if [ "$INPUT_FAIL_ON_FINDINGS" = "true" ] && [ "$FINDINGS_COUNT" -gt 0 ]; then
          echo ""
          echo "❌ Scan failed: Secrets detected"
          exit 1
        fi

        exit 0

    - name: Display summary
      shell: bash
      if: always()
      env:
        SCAN_TYPE: ${{ steps.config.outputs.scan_type }}
        INCREMENTAL: ${{ steps.config.outputs.incremental }}
        RESULTS_FILTER: ${{ steps.config.outputs.results_filter }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_HEAD: ${{ inputs.head }}
        FINDINGS: ${{ steps.scan.outputs.findings_count }}
        HAS_VERIFIED: ${{ steps.scan.outputs.has_verified }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        # The step summary is rendered as Markdown in the run page, so a value
        # written into it is untrusted content in a document other people read.
        # printf %s keeps it data; echo of an interpolated expression would not.
        {
          echo "### 🔐 TruffleHog Secret Scan"
          echo ""
          echo "**Configuration:**"
          printf -- '- Scan type: %s\n' "$SCAN_TYPE"

          if [ "$INCREMENTAL" = "true" ]; then
            printf -- '- Mode: Incremental (`%s..%s`)\n' "$INPUT_BASE" "$INPUT_HEAD"
          elif [ "$SCAN_TYPE" = "git" ]; then
            echo "- Mode: Full Git history"
          else
            echo "- Mode: Filesystem (current files)"
          fi

          printf -- '- Filter: %s\n' "$RESULTS_FILTER"
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"

        {
          echo "**Results:**"

          if [ "$FINDINGS" = "0" ]; then
            echo "✅ No secrets found"
          else
            printf -- '⚠️  Found **%s** potential secret(s)\n' "$FINDINGS"

            if [ "$HAS_VERIFIED" = "true" ]; then
              echo ""
              echo "🚨 **Verified secrets detected!** These are confirmed credentials."
            fi

            echo ""
            printf -- 'Check the [action logs](%s) for details.\n' "$RUN_URL"
          fi
        } >> "$GITHUB_STEP_SUMMARY"