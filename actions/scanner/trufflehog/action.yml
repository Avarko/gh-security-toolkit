name: "TruffleHog Scanner"
description: >
  Scans a Git repository (its history, or a commit range) or a directory for
  leaked credentials with the TruffleHog in the toolkit's scanner image. Writes
  a findings report with the secret values removed; never prints them.

# Why the scanner image and not a trufflehog on the runner: GitHub-hosted
# runners have none, and this action used to call one that was never installed.
# The image is the one actions/scan pins (actions/scan/image.ref), by digest,
# so the TruffleHog that runs is the one the release was tested with.

inputs:
  path:
    description: "Repository or directory to scan, relative to the workspace."
    required: false
    default: "."

  base:
    description: >
      Scan only commits after this one (a SHA or ref), up to head. Empty scans
      all history reachable from head. For a pull request, the base SHA; for a
      push, github.event.before. An all-zero SHA (a new branch) means full history.
    required: false
    default: ""

  head:
    description: "Commit or ref to scan up to."
    required: false
    default: "HEAD"

  scan_type:
    description: "'git' (history), 'filesystem' (the files as they are), or 'auto' (git if path has .git)."
    required: false
    default: "auto"

  results:
    description: >
      Which results to report, comma-separated: verified, unverified, unknown.
      'unverified' matters: a hardcoded database password has nothing to verify
      against and is only ever reported as unverified.
    required: false
    default: "verified,unverified,unknown"

  verify:
    description: >
      Check candidate secrets against their providers (true/false). Verifying
      sends each candidate to the provider's API, i.e. off the runner. Off by
      default; with it off nothing is 'verified', and findings are reported as
      unverified.
    required: false
    default: "false"

  exclude_paths_file:
    description: >
      File of regexes, one per line, matched against repository-relative paths
      (e.g. ^postgres/Dockerfile$). Default: .trufflehogignore in path, if any.
      For single lines, a '# trufflehog:ignore' comment on the line also works.
    required: false
    default: ""

  fail_on_findings:
    description: "Fail the step when anything is reported (true/false)."
    required: false
    default: "true"

  output_dir:
    description: "Where to write trufflehog.json. Default: $RUNNER_TEMP/trufflehog."
    required: false
    default: ""

outputs:
  findings_count:
    description: "Number of findings reported."
    value: ${{ steps.scan.outputs.findings_count }}
  has_verified:
    description: "Whether any finding was verified as a live credential (true/false)."
    value: ${{ steps.scan.outputs.has_verified }}
  report:
    description: "Path to trufflehog.json: findings with location and detector, secret values removed."
    value: ${{ steps.scan.outputs.report }}

runs:
  using: "composite"
  steps:
    # Values arrive as environment variables, never interpolated into the
    # script text: base and head come from pull request events, and on a fork
    # pull request the branch name is chosen by the attacker.
    - name: Run TruffleHog
      id: scan
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_HEAD: ${{ inputs.head }}
        INPUT_SCAN_TYPE: ${{ inputs.scan_type }}
        INPUT_RESULTS: ${{ inputs.results }}
        INPUT_VERIFY: ${{ inputs.verify }}
        INPUT_EXCLUDE_PATHS_FILE: ${{ inputs.exclude_paths_file }}
        INPUT_FAIL_ON_FINDINGS: ${{ inputs.fail_on_findings }}
        INPUT_OUTPUT_DIR: ${{ inputs.output_dir }}
      run: '"$ACTION_PATH/trufflehog.sh"'

    - name: Summary
      if: always() && steps.scan.outputs.report != ''
      shell: bash
      env:
        REPORT: ${{ steps.scan.outputs.report }}
      run: |
        # Every value written here comes from the report, which comes from the
        # scanned repository: file names are attacker-chosen on a fork PR. jq
        # writes them as data, with Markdown table metacharacters escaped.
        {
          echo "### 🔐 TruffleHog secret scan"
          echo ""
          jq -r '"- Mode: \(.mode)\n- Results: \(.results)\n- Verification: \(if .verify then "on" else "off" end)\n"' "$REPORT"
          if [ "$(jq '.findings | length' "$REPORT")" = "0" ]; then
            echo "✅ No secrets found"
          else
            jq -r '"⚠️ **\(.findings | length)** potential secret(s), \([.findings[] | select(.verified)] | length) verified\n"' "$REPORT"
            echo "| Detector | File | Line | Commit | Verified |"
            echo "|---|---|---|---|---|"
            jq -r 'def md: tostring | gsub("(?<c>[|`<>\\[\\]])"; "\\\(.c)");
              .findings[:50][] | "| \(.detector|md) | \(.file|md) | \(.line // "" | md) | \(.commit // "" | .[0:8]) | \(if .verified then "🚨 yes" else "no" end) |"' "$REPORT"
            echo ""
            echo "Values are not shown. Remove the secret, rotate it if it was ever pushed, or mark a false positive in .trufflehogignore or with a \`# trufflehog:ignore\` comment."
          fi
        } >> "$GITHUB_STEP_SUMMARY"
