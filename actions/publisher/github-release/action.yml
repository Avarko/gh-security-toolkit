name: "Publisher (GitHub Release + retention)"
description: "Creates a GitHub Release and uploads scan outputs; optionally prunes old releases in the same channel."
inputs:
  # What to publish
  outdir:
    description: "Directory containing scan outputs (JSON/MD/etc.). Use a unique, namespaced dir."
    required: true

  # Release naming
  release_name:
    description: "Human-friendly release name (e.g. Security scan 2025-11-04-021500)"
    required: true
  tag_name:
    description: "Tag name (must be unique unless overwrite_tag=true). Example: secscan-2025-11-04-021500"
    required: true
  body_file:
    description: "Optional path to Markdown body (e.g. combined summary)"
    required: false
    default: ""
  draft:
    description: "Create as a draft release"
    required: false
    default: "false"
  prerelease:
    description: "Mark as prerelease"
    required: false
    default: "false"
  overwrite_tag:
    description: "If tag exists, delete and recreate before publishing"
    required: false
    default: "false"

  # Channel retention
  channel:
    description: "Logical channel (e.g. nightly-main). Used for pruning related releases."
    required: false
    default: ""
  retention_keep:
    description: "Keep at most N newest releases in this channel (0=ignore)"
    required: false
    default: "10"
  retention_days:
    description: "Delete channel releases older than N days (0=ignore)"
    required: false
    default: "0"

  # Auth (defaults to GITHUB_TOKEN)
  github_token:
    description: "Token with contents:write"
    required: false
    default: "${{ github.token }}"

runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: Validate inputs
      shell: bash
      env:
        INPUT_OUTDIR: ${{ inputs.outdir }}
        INPUT_RELEASE_NAME: ${{ inputs.release_name }}
        INPUT_TAG_NAME: ${{ inputs.tag_name }}
      run: |
        set -euo pipefail
        [ -n "${INPUT_RELEASE_NAME}" ] || { echo "release_name is required"; exit 1; }
        [ -n "${INPUT_TAG_NAME}" ] || { echo "tag_name is required"; exit 1; }
        [ -d "${INPUT_OUTDIR}" ] || { echo "outdir '${INPUT_OUTDIR}' not found"; exit 1; }

    - name: Prepare Gh auth
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: gh auth status || true

    - name: Ensure unique tag (optional overwrite)
      if: ${{ inputs.overwrite_tag == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        INPUT_TAG_NAME: ${{ inputs.tag_name }}
      run: |
        set -euo pipefail
        if gh release view "${INPUT_TAG_NAME}" &>/dev/null; then
          echo "Tag exists -> deleting release + tag: ${INPUT_TAG_NAME}"
          gh release delete "${INPUT_TAG_NAME}" -y || true
          git tag -d "${INPUT_TAG_NAME}" || true
        fi

    - name: Create release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        INPUT_BODY_FILE: ${{ inputs.body_file }}
        INPUT_DRAFT: ${{ inputs.draft }}
        INPUT_PRERELEASE: ${{ inputs.prerelease }}
        INPUT_RELEASE_NAME: ${{ inputs.release_name }}
        INPUT_TAG_NAME: ${{ inputs.tag_name }}
      run: |
        set -euo pipefail

        # Check if release already exists
        if gh release view "${INPUT_TAG_NAME}" &>/dev/null; then
          echo "⚠️ Release already exists: ${INPUT_TAG_NAME}"
          echo "   This should not happen - each scan should have a unique timestamp."
          echo "   Deleting existing release and recreating..."
          gh release delete "${INPUT_TAG_NAME}" -y
        fi

        args=( --title "${INPUT_RELEASE_NAME}" )
        if [ -n "${INPUT_BODY_FILE}" ] && [ -f "${INPUT_BODY_FILE}" ]; then
          args+=( --notes-file "${INPUT_BODY_FILE}" )
        fi
        [ "${INPUT_DRAFT}" = "true" ] && args+=( --draft )
        [ "${INPUT_PRERELEASE}" = "true" ] && args+=( --prerelease )

        echo "📦 Creating release: ${INPUT_TAG_NAME}"
        gh release create "${INPUT_TAG_NAME}" "${args[@]}"

    - name: Upload assets (scan outputs + metadata)
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        INPUT_OUTDIR: ${{ inputs.outdir }}
        INPUT_TAG_NAME: ${{ inputs.tag_name }}
      run: |
        set -euo pipefail
        # Collect non-empty files only (skip empty files to avoid "Bad Content-Length" error)
        mapfile -t files < <(find "${INPUT_OUTDIR}" -type f -size +0 -maxdepth 3 -print)

        if [ ${#files[@]} -eq 0 ]; then
          echo "⚠️ No files to upload in ${INPUT_OUTDIR}"
          exit 0
        fi

        echo "📤 Uploading ${#files[@]} file(s) to release ${INPUT_TAG_NAME}"
        # Upload with --clobber to allow re-runs
        gh release upload "${INPUT_TAG_NAME}" "${files[@]}" --clobber

    - name: Cleanup old releases
      if: ${{ inputs.channel != '' && (inputs.retention_keep != '0' || inputs.retention_days != '0') }}
      uses: Avarko/gh-security-toolkit/actions/cleanup/github-release@v1
      with:
        channel: ${{ inputs.channel }}
        retention_keep: ${{ inputs.retention_keep }}
        retention_days: ${{ inputs.retention_days }}
        github_token: ${{ inputs.github_token }}
        exclude_tag: ${{ inputs.tag_name }}
