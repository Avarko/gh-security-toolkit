name: "Publisher (GitHub Pages)"
description: |
  Publishes security scan results as static HTML pages to GitHub Pages.

  Required permissions in caller workflow:
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: write  # Required for artifact cleanup
inputs:
  # Essential inputs
  outdir:
    description: "Directory containing scan outputs and scan-context.json"
    required: true

  github_token:
    description: "GitHub token for artifact operations (use github.token)"
    required: true

  # Optional customization (reserved for future use)
  config_overrides:
    description: |
      Optional JSON string with configuration overrides.
      Reserved for future use.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Setup temp directories
      id: temp
      shell: bash
      run: |
        # Use unique directory to avoid collisions when action is called multiple times
        TEMP_BASE="${RUNNER_TEMP}/gh-pages-publisher-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        mkdir -p "$TEMP_BASE"
        echo "base=$TEMP_BASE" >> "$GITHUB_OUTPUT"
        echo "config_overrides=${TEMP_BASE}/config-overrides.json" >> "$GITHUB_OUTPUT"
        echo "builder_config=${TEMP_BASE}/builder-config.json" >> "$GITHUB_OUTPUT"
        echo "dashboard_build=${TEMP_BASE}/dashboard-build" >> "$GITHUB_OUTPUT"
        echo "site_data_output=${TEMP_BASE}/site-data-output" >> "$GITHUB_OUTPUT"
        echo "site_dir=${TEMP_BASE}/site" >> "$GITHUB_OUTPUT"

    - name: Check GitHub Pages visibility
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        ${{ github.action_path }}/scripts/check-pages-visibility.sh \
          "${{ github.repository }}"

    - name: Validate GitHub context variables
      shell: bash
      run: |
        ${{ github.action_path }}/scripts/validate-github-context.sh \
          "${{ github.repository_owner }}" \
          "${{ github.repository }}"


    - name: Setup JBang
      uses: jbangdev/setup-jbang@312c53a4221283f9c8e4aa84d8261b82f0c680fb  # Nov 11, 2025

    - name: Create optional config overrides (if provided)
      id: config_overrides
      shell: bash
      run: |
        set -euo pipefail
        if [ -n "${{ inputs.config_overrides }}" ]; then
          # Check if it's a file path or JSON string
          if [ -f "${{ inputs.config_overrides }}" ]; then
            echo "path=${{ inputs.config_overrides }}" >> "$GITHUB_OUTPUT"
            echo "Using config overrides from file: ${{ inputs.config_overrides }}"
          else
            # It's a JSON string, write to temp file
            TEMP_FILE="${{ steps.temp.outputs.config_overrides }}"
            echo '${{ inputs.config_overrides }}' > "$TEMP_FILE"
            echo "path=$TEMP_FILE" >> "$GITHUB_OUTPUT"
            echo "Config overrides provided as JSON string"
          fi
        else
          echo "path=" >> "$GITHUB_OUTPUT"
          echo "No config overrides provided"
        fi

    - name: Create builder configuration
      shell: bash
      run: |
        ${{ github.action_path }}/scripts/create-config.sh \
          "${{ inputs.outdir }}" \
          "${{ steps.temp.outputs.builder_config }}" \
          "${{ steps.config_overrides.outputs.path }}" \
          "${{ steps.temp.outputs.dashboard_build }}"

    - name: Download and restore GitHub Pages site data
      continue-on-error: true
      id: download_history
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        ${{ github.action_path }}/scripts/download-and-restore-history.sh \
          "${{ github.repository }}" \
          "." \
          "$GITHUB_OUTPUT" \
          "${{ steps.temp.outputs.base }}"




    - name: Build Dashboard
      uses: Avarko/gh-security-toolkit/actions/builder/dashboard@main
      with:
        node-version: '24'

    - name: Download Dashboard Artifact
      uses: actions/download-artifact@v8
      with:
        name: __gh_security_toolkit__security-dashboard-build
        path: ${{ steps.temp.outputs.dashboard_build }}

    - name: Build GitHub Pages
      shell: bash
      env:
        GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        echo "Building GitHub Pages (incremental update)..."

        # Run the builder (processes data in current directory)
        jbang "${{ github.action_path }}/../../../scripts/github_pages_builder.java" \
          "${{ steps.temp.outputs.builder_config }}"

        # Debug: show hist contents after Java builder
        echo "📋 Contents of data/hist after Java builder:"
        ls -la ./data/hist/ 2>/dev/null || echo "   (directory not found or empty)"

        # Archive the updated data for persistence across runs
        ${{ github.action_path }}/scripts/archive-scan-history.sh \
          "." \
          "${{ steps.temp.outputs.site_data_output }}"

        # Prepare site directory for deployment
        SITE_DIR="${{ steps.temp.outputs.site_dir }}"
        mkdir -p "$SITE_DIR"

        # Debug: show hist contents before move
        echo "📋 Contents of data/hist before move:"
        ls -la ./data/hist/ 2>/dev/null || echo "   (directory not found or empty)"

        # Move all site content to deployment directory
        for item in data index.html assets favicon.ico 404.html config; do
          [ -e "./$item" ] && mv "./$item" "$SITE_DIR/" || true
        done

        # Debug: show hist contents after move
        echo "📋 Contents of $SITE_DIR/data/hist after move:"
        ls -la "$SITE_DIR/data/hist/" 2>/dev/null || echo "   (directory not found or empty)"

        echo "Site prepared for deployment at $SITE_DIR"

    - name: Upload GitHub Pages site data artifact
      id: upload_site_data
      uses: actions/upload-artifact@v6
      with:
        name: __gh_security_toolkit__github_pages_site_data
        path: ${{ steps.temp.outputs.site_data_output }}/scan-history.tar.gz
        retention-days: 90
        overwrite: true

    - name: Cleanup old GitHub Pages site data artifacts
      if: ${{ steps.upload_site_data.outcome == 'success' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        ${{ github.action_path }}/scripts/cleanup-old-artifacts.sh \
          "${{ github.repository }}" \
          "__gh_security_toolkit__github_pages_site_data" \
          "${{ steps.upload_site_data.outputs.artifact-id }}"

    - name: Setup Pages
      uses: actions/configure-pages@v6

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: ${{ steps.temp.outputs.site_dir }}
        name: __gh_security_toolkit__github_pages_deployment
        retention-days: 1

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
      with:
        artifact_name: __gh_security_toolkit__github_pages_deployment

outputs:
  pages_url:
    description: "URL to the deployed GitHub Pages site"
    value: ${{ steps.deployment.outputs.page_url }}
