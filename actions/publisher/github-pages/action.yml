name: "Publisher (GitHub Pages)"
description: |
  Publishes security scan results as static HTML pages to GitHub Pages.

  Required permissions in caller workflow:
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: write  # Required for artifact cleanup
inputs:
  # Essential inputs
  outdir:
    description: "Directory containing scan outputs and scan-context.json"
    required: true

  github_token:
    description: "GitHub token for artifact operations (use github.token)"
    required: true

  # Optional customization (reserved for future use)
  config_overrides:
    description: |
      Optional JSON string with configuration overrides.
      Reserved for future use.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Setup temp directories
      id: temp
      shell: bash
      run: |
        # Use unique directory to avoid collisions when action is called multiple times
        TEMP_BASE="${RUNNER_TEMP}/gh-pages-publisher-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        mkdir -p "$TEMP_BASE"
        echo "base=$TEMP_BASE" >> "$GITHUB_OUTPUT"
        echo "config_overrides=${TEMP_BASE}/config-overrides.json" >> "$GITHUB_OUTPUT"
        echo "builder_config=${TEMP_BASE}/builder-config.json" >> "$GITHUB_OUTPUT"
        echo "dashboard_build=${TEMP_BASE}/dashboard-build" >> "$GITHUB_OUTPUT"
        echo "site_data_output=${TEMP_BASE}/site-data-output" >> "$GITHUB_OUTPUT"
        echo "site_dir=${TEMP_BASE}/site" >> "$GITHUB_OUTPUT"

    - name: Check GitHub Pages visibility
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        ${GITHUB_ACTION_PATH}/scripts/check-pages-visibility.sh \
          "${GITHUB_REPOSITORY}"

    - name: Validate GitHub context variables
      shell: bash
      run: |
        ${GITHUB_ACTION_PATH}/scripts/validate-github-context.sh \
          "${GITHUB_REPOSITORY_OWNER}" \
          "${GITHUB_REPOSITORY}"


    - name: Setup JBang
      shell: bash
      run: "${GITHUB_ACTION_PATH}/../../../scripts/install-jbang.sh"

    - name: Create optional config overrides (if provided)
      id: config_overrides
      shell: bash
      env:
        INPUT_CONFIG_OVERRIDES: ${{ inputs.config_overrides }}
        TEMP_CONFIG_OVERRIDES: ${{ steps.temp.outputs.config_overrides }}
      run: |
        set -euo pipefail
        if [ -n "$INPUT_CONFIG_OVERRIDES" ]; then
          # Check if it's a file path or JSON string
          if [ -f "$INPUT_CONFIG_OVERRIDES" ]; then
            printf 'path=%s\n' "$INPUT_CONFIG_OVERRIDES" >> "$GITHUB_OUTPUT"
            printf 'Using config overrides from file: %s\n' "$INPUT_CONFIG_OVERRIDES"
          else
            # It's a JSON string, write to temp file. printf, not echo of a
            # single-quoted expression: a quote in the JSON used to end the
            # quoting and hand the remainder to the shell.
            TEMP_FILE="$TEMP_CONFIG_OVERRIDES"
            printf '%s\n' "$INPUT_CONFIG_OVERRIDES" > "$TEMP_FILE"
            printf 'path=%s\n' "$TEMP_FILE" >> "$GITHUB_OUTPUT"
            echo "Config overrides provided as JSON string"
          fi
        else
          echo "path=" >> "$GITHUB_OUTPUT"
          echo "No config overrides provided"
        fi

    - name: Create builder configuration
      shell: bash
      env:
        INPUT_OUTDIR: ${{ inputs.outdir }}
        STEP_CONFIG_OVERRIDES_PATH: ${{ steps.config_overrides.outputs.path }}
        STEP_TEMP_BUILDER_CONFIG: ${{ steps.temp.outputs.builder_config }}
        STEP_TEMP_DASHBOARD_BUILD: ${{ steps.temp.outputs.dashboard_build }}
      run: |
        ${GITHUB_ACTION_PATH}/scripts/create-config.sh \
          "${INPUT_OUTDIR}" \
          "${STEP_TEMP_BUILDER_CONFIG}" \
          "${STEP_CONFIG_OVERRIDES_PATH}" \
          "${STEP_TEMP_DASHBOARD_BUILD}"

    - name: Download and restore GitHub Pages site data
      continue-on-error: true
      id: download_history
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        STEP_TEMP_BASE: ${{ steps.temp.outputs.base }}
      run: |
        ${GITHUB_ACTION_PATH}/scripts/download-and-restore-history.sh \
          "${GITHUB_REPOSITORY}" \
          "." \
          "$GITHUB_OUTPUT" \
          "${STEP_TEMP_BASE}"




    - name: Build Dashboard
      uses: Avarko/gh-security-toolkit/actions/builder/dashboard@v1
      with:
        node-version: '24'

    - name: Download Dashboard Artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: __gh_security_toolkit__security-dashboard-build
        path: ${{ steps.temp.outputs.dashboard_build }}

    - name: Build GitHub Pages
      shell: bash
      env:
        GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        STEP_TEMP_BUILDER_CONFIG: ${{ steps.temp.outputs.builder_config }}
        STEP_TEMP_SITE_DATA_OUTPUT: ${{ steps.temp.outputs.site_data_output }}
        STEP_TEMP_SITE_DIR: ${{ steps.temp.outputs.site_dir }}
      run: |
        set -euo pipefail
        echo "Building GitHub Pages (incremental update)..."

        # Run the builder (processes data in current directory)
        jbang "${GITHUB_ACTION_PATH}/../../../scripts/github_pages_builder.java" \
          "${STEP_TEMP_BUILDER_CONFIG}"

        # Debug: show hist contents after Java builder
        echo "📋 Contents of data/hist after Java builder:"
        ls -la ./data/hist/ 2>/dev/null || echo "   (directory not found or empty)"

        # Archive the updated data for persistence across runs
        ${GITHUB_ACTION_PATH}/scripts/archive-scan-history.sh \
          "." \
          "${STEP_TEMP_SITE_DATA_OUTPUT}"

        # Prepare site directory for deployment
        SITE_DIR="${STEP_TEMP_SITE_DIR}"
        mkdir -p "$SITE_DIR"

        # Debug: show hist contents before move
        echo "📋 Contents of data/hist before move:"
        ls -la ./data/hist/ 2>/dev/null || echo "   (directory not found or empty)"

        # Move all site content to deployment directory
        for item in data index.html assets favicon.ico 404.html config; do
          [ -e "./$item" ] && mv "./$item" "$SITE_DIR/" || true
        done

        # Debug: show hist contents after move
        echo "📋 Contents of $SITE_DIR/data/hist after move:"
        ls -la "$SITE_DIR/data/hist/" 2>/dev/null || echo "   (directory not found or empty)"

        echo "Site prepared for deployment at $SITE_DIR"

    - name: Upload GitHub Pages site data artifact
      id: upload_site_data
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
      with:
        name: __gh_security_toolkit__github_pages_site_data
        path: ${{ steps.temp.outputs.site_data_output }}/scan-history.tar.gz
        retention-days: 90
        overwrite: true

    - name: Cleanup old GitHub Pages site data artifacts
      if: ${{ steps.upload_site_data.outcome == 'success' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        STEP_UPLOAD_SITE_DATA_ARTIFACT_ID: ${{ steps.upload_site_data.outputs.artifact-id }}
      run: |
        ${GITHUB_ACTION_PATH}/scripts/cleanup-old-artifacts.sh \
          "${GITHUB_REPOSITORY}" \
          "__gh_security_toolkit__github_pages_site_data" \
          "${STEP_UPLOAD_SITE_DATA_ARTIFACT_ID}"

    - name: Setup Pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
      with:
        path: ${{ steps.temp.outputs.site_dir }}
        name: __gh_security_toolkit__github_pages_deployment
        retention-days: 1

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
      with:
        artifact_name: __gh_security_toolkit__github_pages_deployment

outputs:
  pages_url:
    description: "URL to the deployed GitHub Pages site"
    value: ${{ steps.deployment.outputs.page_url }}
