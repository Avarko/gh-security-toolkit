name: "Publisher (GitHub Pages)"
description: "Publishes security scan results as static HTML pages to GitHub Pages"
inputs:
  # What to publish
  outdir:
    description: "Directory containing scan outputs (JSON/MD/etc.)"
    required: true

  # Metadata
  metadata_timestamp:
    description: "Timestamp of the scan"
    required: true
  metadata_branch:
    description: "Branch name"
    required: false
    default: ""
  metadata_repository:
    description: "Repository name (owner/repo)"
    required: false
    default: ""
  metadata_commit_sha:
    description: "Commit SHA"
    required: false
    default: ""
  metadata_image_name:
    description: "Docker image name"
    required: false
    default: ""
  metadata_scan_id:
    description: "Scan run ID"
    required: false
    default: ""

  # Pages configuration
  channel:
    description: "Channel name for organizing scans (e.g., 'nightly-master', 'pr-123')"
    required: true
  pages_root:
    description: "Root directory for GitHub Pages (e.g., 'docs')"
    required: false
    default: "docs"
  retention_keep:
    description: "Keep at most N full scan results per channel in /runs (0=unlimited). Note: scan-history.json retains stats for all scans regardless of this limit."
    required: false
    default: "10"
  retention_days:
    description: "Days to retain scan history artifact in GitHub (0=maximum allowed by GitHub)"
    required: false
    default: "90"

  # GitHub token for API access
  github_token:
    description: "GitHub token for artifact operations (use github.token)"
    required: true

  # Dashboard / tenant configuration
  dashboard_mode:
    description: 'Dashboard mode, e.g. "single-tenant" or "multi-tenant"'
    required: false
    default: "single-tenant"

  dashboard_org_slug:
    description: "Organization slug used in /data/<org>/<app>/<repo>"
    required: false
    default: ""

  dashboard_app_slug:
    description: "Application slug used in /data/<org>/<app>/<repo>"
    required: false
    default: ""

  dashboard_repo_slug:
    description: "Repository slug used in /data/<org>/<app>/<repo>"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Check GitHub Pages visibility
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        echo "🔍 Checking GitHub Pages visibility..."

        # Query GitHub Pages configuration (single API call)
        echo "📡 DEBUG: Querying GitHub API for Pages configuration..."
        FULL_RESPONSE=$(gh api \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "/repos/${{ github.repository }}/pages" 2>&1) || FULL_RESPONSE=""

        echo "📦 DEBUG: Full API response:"
        echo "$FULL_RESPONSE"
        echo ""

        # Extract .public field from response (handle null vs false properly)
        if [ -n "$FULL_RESPONSE" ]; then
          IS_PUBLIC=$(echo "$FULL_RESPONSE" | jq -r 'if .public == null then "unknown" else (.public | tostring) end' 2>/dev/null) || IS_PUBLIC="unknown"
        else
          IS_PUBLIC="unknown"
        fi

        echo "🔎 DEBUG: Extracted .public value: '$IS_PUBLIC'"
        echo ""

        if [ "$IS_PUBLIC" = "true" ]; then
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "❌ ERROR: GitHub Pages is configured as PUBLIC"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Security scan results MUST NOT be published to a public Pages site."
          echo ""
          echo "To fix this:"
          echo "  1. Go to: Settings → Pages"
          echo "  2. Under 'Visibility', select 'Private'"
          echo "  3. Click 'Save'"
          echo ""
          echo "Note: Private Pages requires GitHub Enterprise Cloud."
          echo "      If not available, use 'publish_to: github-release' instead."
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          exit 1
        elif [ "$IS_PUBLIC" = "false" ]; then
          echo "✅ GitHub Pages is configured as Private - proceeding with deployment"
        elif [ "$IS_PUBLIC" = "null" ] || [ "$IS_PUBLIC" = "unknown" ]; then
          echo "⚠️  Warning: Could not query GitHub Pages configuration."
          echo "   Pages may not be enabled yet, or visibility setting is not available."
          echo "   Proceeding with deployment."
          echo ""
          echo "   ⚠️  IMPORTANT: After first deployment, verify in Settings → Pages that:"
          echo "      • Pages is enabled and deployed from 'gh-pages' branch"
          echo "      • Visibility is set to 'Private' (requires GitHub Enterprise Cloud)"
          echo "      • If Private Pages is not available, use 'publish_to: github-release' instead"
        else
          echo "⚠️  Warning: Unexpected visibility value: $IS_PUBLIC"
          echo "   Proceeding with deployment, but please verify Pages configuration."
        fi

    - name: Validate dashboard tenant configuration
      if: ${{ inputs.dashboard_mode != '' }}
      shell: bash
      run: |
        set -euo pipefail

        if [ -z "${{ inputs.dashboard_org_slug }}" ] || \
           [ -z "${{ inputs.dashboard_app_slug }}" ] || \
           [ -z "${{ inputs.dashboard_repo_slug }}" ]; then
          echo "❌ dashboard_mode='${{ inputs.dashboard_mode }}' but one or more of"
          echo "   dashboard_org_slug / dashboard_app_slug / dashboard_repo_slug is empty."
          echo "   These are required to build tenant-aware /data/<org>/<app>/<repo> structure."
          exit 1
        fi

        echo "✅ Dashboard tenant configuration is valid:"
        echo "   org=${{ inputs.dashboard_org_slug }}, app=${{ inputs.dashboard_app_slug }}, repo=${{ inputs.dashboard_repo_slug }}"

    - name: Compute tenant data root
      id: tenant_root
      shell: bash
      run: |
        set -euo pipefail

        DATA_ROOT="data"

        # 1) Primarily use action inputs in single-tenant mode
        if [ "${{ inputs.dashboard_mode }}" = "single-tenant" ] && \
           [ -n "${{ inputs.dashboard_org_slug }}" ] && \
           [ -n "${{ inputs.dashboard_app_slug }}" ] && \
           [ -n "${{ inputs.dashboard_repo_slug }}" ]; then
          DATA_ROOT="data/${{ inputs.dashboard_org_slug }}/${{ inputs.dashboard_app_slug }}/${{ inputs.dashboard_repo_slug }}"
        else
          # 2) Fallback: read defaults.json if it exists
          if [ -f "${{ inputs.pages_root }}/data/defaults.json" ]; then
            MODE=$(jq -r '.mode // empty' "${{ inputs.pages_root }}/data/defaults.json")
            if [ "$MODE" = "single-tenant" ]; then
              ORG=$(jq -r '.defaultOrg // empty' "${{ inputs.pages_root }}/data/defaults.json")
              APP=$(jq -r '.defaultApp // empty' "${{ inputs.pages_root }}/data/defaults.json")
              REPO=$(jq -r '.defaultRepo // empty' "${{ inputs.pages_root }}/data/defaults.json")
              if [ -n "$ORG" ] && [ -n "$APP" ] && [ -n "$REPO" ]; then
                DATA_ROOT="data/$ORG/$APP/$REPO"
              fi
            fi
          fi
        fi

        echo "Tenant DATA_ROOT=$DATA_ROOT"
        echo "data_root=$DATA_ROOT" >> "$GITHUB_OUTPUT"


    - name: Setup JBang
      uses: jbangdev/setup-jbang@main

    - name: Create metadata JSON
      id: metadata
      shell: bash
      run: |
        set -euo pipefail
        META_FILE="${{ inputs.outdir }}/scan-metadata.json"
        jq -n \
          --arg ts "${{ inputs.metadata_timestamp }}" \
          --arg branch "${{ inputs.metadata_branch }}" \
          --arg repo "${{ inputs.metadata_repository }}" \
          --arg sha "${{ inputs.metadata_commit_sha }}" \
          --arg image "${{ inputs.metadata_image_name }}" \
          --arg scan_id "${{ inputs.metadata_scan_id }}" \
          --arg app_docs_url "${{ inputs.app_docs_url }}" \
          --arg app_issues_url "${{ inputs.app_issues_url }}" \
          --arg ci_job_name "${{ inputs.ci_job_name }}" \
          --arg ci_job_url "${{ inputs.ci_job_url }}" \
          --arg trivy_version "${{ inputs.trivy_version }}" \
          --arg semgrep_version "${{ inputs.semgrep_version }}" \
          '{
            timestamp: $ts,
            branch: $branch,
            repository: $repo,
            commit_sha: $sha,
            image_name: $image,
            scan_run_id: $scan_id
          }' > "$META_FILE"
        echo "meta_json=$META_FILE" >> "$GITHUB_OUTPUT"

    - name: Download scan history artifact
      continue-on-error: true
      id: download_history
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        set -euo pipefail

        ARTIFACT_NAME="__gh_security_toolkit__scan_history_${{ inputs.channel }}"
        REPO="${{ github.repository }}"
        OUTPUT_DIR="/tmp/scan-history-artifact"

        echo "==> Searching for artifact: $ARTIFACT_NAME"

        # Find the most recent artifact with this name (sorted by created_at DESC)
        ARTIFACT_URL=$(gh api \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "/repos/$REPO/actions/artifacts?name=$ARTIFACT_NAME&per_page=100" \
          --jq '.artifacts | sort_by(.created_at) | reverse | .[0].archive_download_url // empty')

        if [ -z "$ARTIFACT_URL" ]; then
          echo "==> No artifact found with name: $ARTIFACT_NAME"
          echo "found=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "==> Downloading artifact from: $ARTIFACT_URL"
        mkdir -p "$OUTPUT_DIR"

        # Download and extract artifact
        gh api "$ARTIFACT_URL" > "$OUTPUT_DIR/artifact.zip"
        cd "$OUTPUT_DIR"
        unzip -q artifact.zip
        rm artifact.zip

        echo "==> Artifact downloaded successfully"
        echo "found=true" >> "$GITHUB_OUTPUT"

    - name: Restore scan history
      shell: bash
      run: |
        set -euo pipefail

        PAGES_ROOT="${{ inputs.pages_root }}"
        DATA_ROOT="${{ steps.tenant_root.outputs.data_root }}"
        HISTORY_ARCHIVE="/tmp/scan-history-artifact/scan-history.tar.gz"

        if [ -f "$HISTORY_ARCHIVE" ]; then
          echo "📦 Restoring scan data from artifact..."
          mkdir -p "$PAGES_ROOT"
          tar -xzf "$HISTORY_ARCHIVE" -C "$PAGES_ROOT" 2>/dev/null || echo "⚠️  Archive extraction had warnings (may be legacy format)"

          mkdir -p "$PAGES_ROOT/$DATA_ROOT/runs" "$PAGES_ROOT/$DATA_ROOT/hist" "$PAGES_ROOT/$DATA_ROOT/channels"

          # Count existing scans within this tenant
          if [ -d "$PAGES_ROOT/$DATA_ROOT/runs" ]; then
            TOTAL_SCANS=$(find "$PAGES_ROOT/$DATA_ROOT/runs" -mindepth 2 -maxdepth 2 -type d 2>/dev/null | wc -l)
            CHANNELS=$(find "$PAGES_ROOT/$DATA_ROOT/runs" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l)
            echo "   ✅ Restored $TOTAL_SCANS runs across $CHANNELS channels for this tenant"
          fi
          if [ -f "$PAGES_ROOT/$DATA_ROOT/hist/scan-history.json" ]; then
            echo "   ✅ Restored persistent scan history JSON (v2) for this tenant"
          fi
        else
          echo "ℹ️  No existing scan data found - starting fresh for this tenant"
          mkdir -p "$PAGES_ROOT/$DATA_ROOT/runs/${{ inputs.channel }}"
          mkdir -p "$PAGES_ROOT/$DATA_ROOT/hist"
          mkdir -p "$PAGES_ROOT/$DATA_ROOT/channels"
        fi


    - name: Apply retention policy
      if: ${{ inputs.retention_keep != '0' }}
      shell: bash
      run: |
        set -euo pipefail

        CHANNEL="${{ inputs.channel }}"
        KEEP="${{ inputs.retention_keep }}"
        PAGES_ROOT="${{ inputs.pages_root }}"
        DATA_ROOT="${{ steps.tenant_root.outputs.data_root }}"
        CHANNEL_PATH="$PAGES_ROOT/$DATA_ROOT/runs/$CHANNEL"
        NEW_SCAN="${{ inputs.metadata_timestamp }}"

        echo "🧹 Applying retention policy for tenant:"
        echo "   data_root=$DATA_ROOT, channel=$CHANNEL (keep=$KEEP)"

        if [ ! -d "$CHANNEL_PATH" ]; then
          echo "   ⏭️  No existing runs for this channel - retention not needed"
          exit 0
        fi

        mapfile -t scans < <(find "$CHANNEL_PATH" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -r)

        scans=("$NEW_SCAN" "${scans[@]}")
        mapfile -t scans < <(printf '%s\n' "${scans[@]}" | sort -u -r)

        total=${#scans[@]}
        echo "   Total runs (including new): $total"
        echo "   Retention limit: $KEEP"

        if [ "$total" -le "$KEEP" ]; then
          echo "   ✅ No cleanup needed (total=$total, keep=$KEEP)"
          exit 0
        fi

        deleted=0
        for ((i=KEEP; i<total; i++)); do
          scan="${scans[$i]}"
          if [ "$scan" != "$NEW_SCAN" ] && [ -d "$CHANNEL_PATH/$scan" ]; then
            echo "   🗑️  Deleting old run: $scan"
            rm -rf "$CHANNEL_PATH/$scan"
            deleted=$((deleted + 1))
          fi
        done

        echo "   ✅ Deleted $deleted old runs, keeping $KEEP newest"


    - name: Build Dashboard
      uses: Avarko/gh-security-toolkit/actions/builder/dashboard@reactui
      with:
        node-version: '24'

    - name: Download Dashboard Artifact
      uses: actions/download-artifact@v4
      with:
        name: __gh_security_toolkit__security-dashboard-build
        path: /tmp/dashboard-build

    - name: Build GitHub Pages
      shell: bash
      run: |
        set -euo pipefail

        echo "🏗️  Building GitHub Pages (incremental update)..."

        jbang "${{ github.action_path }}/../../../scripts/github_pages_builder.java" \
          "${{ inputs.outdir }}" \
          "${{ inputs.pages_root }}" \
          "${{ inputs.metadata_timestamp }}" \
          "${{ inputs.channel }}" \
          "${{ steps.metadata.outputs.meta_json }}" \
          "/tmp/dashboard-build" \
          "${{ inputs.dashboard_org_slug }}" \
          "${{ inputs.dashboard_app_slug }}" \
          "${{ inputs.dashboard_repo_slug }}"

    - name: Archive scan history
      shell: bash
      run: |
        set -euo pipefail

        PAGES_ROOT="${{ inputs.pages_root }}"
        DATA_ROOT="${{ steps.tenant_root.outputs.data_root }}"
        ARCHIVE_DIR="/tmp/scan-history-output"

        echo "📦 Archiving scan data for tenant root '$DATA_ROOT' ..."

        mkdir -p "$ARCHIVE_DIR"

        ITEMS=()
        if [ -d "$PAGES_ROOT/$DATA_ROOT/runs" ]; then
          ITEMS+=("$DATA_ROOT/runs")
        fi
        if [ -d "$PAGES_ROOT/$DATA_ROOT/channels" ]; then
          ITEMS+=("$DATA_ROOT/channels")
        fi
        if [ -f "$PAGES_ROOT/$DATA_ROOT/hist/scan-history.json" ]; then
          ITEMS+=("$DATA_ROOT/hist")
        fi

        if [ ${#ITEMS[@]} -eq 0 ]; then
          echo "   ⚠️  Nothing to archive yet for this tenant"
          tar -czf "$ARCHIVE_DIR/scan-history.tar.gz" -T /dev/null
        else
          tar -czf "$ARCHIVE_DIR/scan-history.tar.gz" -C "$PAGES_ROOT" "${ITEMS[@]}"
        fi

        SIZE=$(du -h "$ARCHIVE_DIR/scan-history.tar.gz" | cut -f1)
        if [ -d "$PAGES_ROOT/$DATA_ROOT/runs" ]; then
          RUN_COUNT=$(find "$PAGES_ROOT/$DATA_ROOT/runs" -mindepth 2 -maxdepth 2 -type d 2>/dev/null | wc -l)
          echo "   ✅ Archived $RUN_COUNT runs ($SIZE) with persistent history (v2) for this tenant"
        else
          echo "   ✅ Archived persistent history ($SIZE) for this tenant"
        fi


    - name: Upload scan history artifact
      id: upload_history
      uses: actions/upload-artifact@v4
      with:
        name: __gh_security_toolkit__scan_history_${{ inputs.channel }}
        path: /tmp/scan-history-output/scan-history.tar.gz
        retention-days: ${{ inputs.retention_days }}
        overwrite: true

    - name: Cleanup old scan history artifacts
      if: ${{ steps.upload_history.outcome == 'success' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        ARTIFACT_NAME="__gh_security_toolkit__scan_history_${{ inputs.channel }}"
        REPO="${{ github.repository }}"
        CURRENT_ARTIFACT_ID="${{ steps.upload_history.outputs.artifact-id }}"

        echo "🧹 Cleaning up old scan history artifacts for channel: ${{ inputs.channel }}"
        echo "   Current artifact ID: $CURRENT_ARTIFACT_ID"

        # List all artifacts with this name
        ARTIFACTS=$(gh api \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "/repos/$REPO/actions/artifacts?name=$ARTIFACT_NAME&per_page=100" \
          --jq '.artifacts[] | select(.id != '$CURRENT_ARTIFACT_ID') | .id')

        if [ -z "$ARTIFACTS" ]; then
          echo "   ✅ No old artifacts to clean up"
          exit 0
        fi

        # Delete old artifacts
        DELETED=0
        for ARTIFACT_ID in $ARTIFACTS; do
          echo "   🗑️  Deleting artifact ID: $ARTIFACT_ID"
          gh api \
            --method DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$REPO/actions/artifacts/$ARTIFACT_ID" || echo "   ⚠️  Failed to delete artifact $ARTIFACT_ID (may already be deleted)"
          DELETED=$((DELETED + 1))
        done

        echo "   ✅ Deleted $DELETED old artifact(s)"

    - name: Write dashboard defaults.json
      if: ${{ inputs.dashboard_mode != '' }}
      shell: bash
      run: |
        set -euo pipefail

        PAGES_ROOT="${{ inputs.pages_root }}"
        DATA_DIR="$PAGES_ROOT/data"
        mkdir -p "$DATA_DIR"

        cat > "$DATA_DIR/defaults.json" << EOF
        {
          "mode": "${{ inputs.dashboard_mode }}",
          "defaultOrg": "${{ inputs.dashboard_org_slug }}",
          "defaultApp": "${{ inputs.dashboard_app_slug }}",
          "defaultRepo": "${{ inputs.dashboard_repo_slug }}"
        }
        EOF

        echo "✅ Wrote $DATA_DIR/defaults.json:"
        cat "$DATA_DIR/defaults.json"


    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ${{ inputs.pages_root }}
        name: __gh_security_toolkit__security-dashboard-pages-${{ inputs.channel }}
        retention-days: 1

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      with:
        artifact_name: __gh_security_toolkit__security-dashboard-pages-${{ inputs.channel }}

outputs:
  pages_url:
    description: "URL to the deployed GitHub Pages site"
    value: ${{ steps.deployment.outputs.page_url }}
