name: "Publisher (GitHub Pages)"
description: "Publishes security scan results as static HTML pages to GitHub Pages"
inputs:
  # Essential inputs
  outdir:
    description: "Directory containing scan outputs and scan-metadata.json"
    required: true

  channel:
    description: "Channel name for organizing scans (e.g., 'nightly', 'pr-123')"
    required: true

  github_token:
    description: "GitHub token for artifact operations (use github.token)"
    required: true

  # Optional customization
  config_overrides:
    description: |
      Optional JSON string with tenant branding and configuration overrides.
      Example: {"branding": {"displayName": "My App", "orgDisplayName": "My Org", "logoUrl": "/logo.png"}}
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Check GitHub Pages visibility
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        ${{ github.action_path }}/scripts/check-pages-visibility.sh \
          "${{ github.repository }}"

    - name: Validate GitHub context variables
      shell: bash
      run: |
        ${{ github.action_path }}/scripts/validate-github-context.sh \
          "${{ github.repository_owner }}" \
          "${{ github.repository }}"


    - name: Setup JBang
      uses: jbangdev/setup-jbang@main

    - name: Create optional config overrides (if provided)
      id: config_overrides
      shell: bash
      run: |
        set -euo pipefail
        if [ -n "${{ inputs.config_overrides }}" ]; then
          # Check if it's a file path or JSON string
          if [ -f "${{ inputs.config_overrides }}" ]; then
            echo "path=${{ inputs.config_overrides }}" >> "$GITHUB_OUTPUT"
            echo "📄 Using config overrides from file: ${{ inputs.config_overrides }}"
          else
            # It's a JSON string, write to temp file
            TEMP_FILE="/tmp/config-overrides.json"
            echo '${{ inputs.config_overrides }}' > "$TEMP_FILE"
            echo "path=$TEMP_FILE" >> "$GITHUB_OUTPUT"
            echo "📝 Config overrides provided as JSON string"
          fi
        else
          echo "path=" >> "$GITHUB_OUTPUT"
          echo "ℹ️  No config overrides provided"
        fi

    - name: Create builder configuration
      shell: bash
      run: |
        ${{ github.action_path }}/scripts/create-config.sh \
          "${{ inputs.outdir }}" \
          "${{ inputs.channel }}" \
          "/tmp/builder-config.json" \
          "${{ steps.config_overrides.outputs.path }}"

    - name: Download and restore multi-tenant config
      continue-on-error: true
      id: download_config
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        ${{ github.action_path }}/scripts/download-and-restore-config.sh \
          "${{ github.repository }}" \
          "." \
          "$GITHUB_OUTPUT"

    - name: Download and restore GitHub Pages site data
      continue-on-error: true
      id: download_history
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        ${{ github.action_path }}/scripts/download-and-restore-history.sh \
          "${{ github.repository }}" \
          "." \
          "$GITHUB_OUTPUT"




    - name: Build Dashboard
      uses: Avarko/gh-security-toolkit/actions/builder/dashboard@reactui
      with:
        node-version: '24'

    - name: Download Dashboard Artifact
      uses: actions/download-artifact@v4
      with:
        name: __gh_security_toolkit__security-dashboard-build
        path: /tmp/dashboard-build

    - name: Build GitHub Pages
      shell: bash
      env:
        GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        echo "🏗️  Building GitHub Pages (incremental update)..."

        jbang "${{ github.action_path }}/../../../scripts/github_pages_builder.java" \
          /tmp/builder-config.json

    - name: Archive GitHub Pages site data
      shell: bash
      run: |
        ${{ github.action_path }}/scripts/archive-scan-history.sh \
          "." \
          "/tmp/github-pages-site-data-output"


    - name: Upload GitHub Pages site data artifact
      id: upload_site_data
      uses: actions/upload-artifact@v4
      with:
        name: __gh_security_toolkit__github_pages_site_data
        path: /tmp/github-pages-site-data-output/scan-history.tar.gz
        retention-days: 90
        overwrite: true

    - name: Cleanup old GitHub Pages site data artifacts
      if: ${{ steps.upload_site_data.outcome == 'success' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        ${{ github.action_path }}/scripts/cleanup-old-artifacts.sh \
          "${{ github.repository }}" \
          "__gh_security_toolkit__github_pages_site_data" \
          "${{ steps.upload_site_data.outputs.artifact-id }}"


    - name: Archive multi-tenant config
      shell: bash
      run: |
        ${{ github.action_path }}/scripts/archive-multi-tenant-config.sh \
          "." \
          "/tmp/multi-tenant-config-output"

    - name: Upload multi-tenant config artifact
      id: upload_config
      uses: actions/upload-artifact@v4
      with:
        name: __gh_security_toolkit__multi-tenant-config
        path: /tmp/multi-tenant-config-output/multi-tenant-config.tar.gz
        retention-days: 90
        overwrite: true

    - name: Cleanup old multi-tenant config artifacts
      if: ${{ steps.upload_config.outcome == 'success' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        ${{ github.action_path }}/scripts/cleanup-old-artifacts.sh \
          "${{ github.repository }}" \
          "__gh_security_toolkit__multi-tenant-config" \
          "${{ steps.upload_config.outputs.artifact-id }}"


    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: .
        name: __gh_security_toolkit__github_pages_deployment
        retention-days: 1

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      with:
        artifact_name: __gh_security_toolkit__github_pages_deployment

outputs:
  pages_url:
    description: "URL to the deployed GitHub Pages site"
    value: ${{ steps.deployment.outputs.page_url }}
