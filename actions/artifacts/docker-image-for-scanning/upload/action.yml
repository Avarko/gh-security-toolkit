name: "Upload Docker image for scanning"
description: "Saves and uploads Docker image as tar file for security scanning."
inputs:
  image-name:
    description: "Docker image name (with tag) to save, e.g., 'myapp:latest'"
    required: true
  channel:
    description: "Channel name for organizing scans (e.g., 'nightly', 'pr-123')"
    required: true
  retention-days:
    description: "Number of days to retain the artifact"
    required: false
    default: "1"
  compression-level:
    description: "Compression level (0-9). 0 = no compression (fastest), 9 = maximum compression (slowest)"
    required: false
    default: "0"

runs:
  using: "composite"
  steps:
    - name: Save Docker image to tar
      shell: bash
      run: |
        echo "Saving Docker image: ${{ inputs.image-name }}"
        docker save "${{ inputs.image-name }}" -o /tmp/gh-security-toolkit-docker-image.tar
        echo "Image saved to /tmp/gh-security-toolkit-docker-image.tar"
        ls -lh /tmp/gh-security-toolkit-docker-image.tar

    - name: Create scan context metadata
      shell: bash
      run: |
        # Create scan-context.json with metadata from GitHub Actions environment
        SCAN_CONTEXT_DIR="/tmp/gh-security-toolkit-scan-context"
        mkdir -p "$SCAN_CONTEXT_DIR"

        cat > "$SCAN_CONTEXT_DIR/scan-context.json" << EOF
        {
          "channel": "${{ inputs.channel }}",
          "timestamp": "$(date -u +'%Y-%m-%d-%H%M%SZ')",
          "branch": "${GITHUB_REF_NAME:-}",
          "repository": "${GITHUB_REPOSITORY:-}",
          "commitSha": "${GITHUB_SHA:-}",
          "scanId": "${GITHUB_RUN_ID:-}",
          "ciJobName": "${GITHUB_WORKFLOW:-}",
          "ciJobUrl": "${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
          "actorName": "${GITHUB_ACTOR:-}"
        }
        EOF

        echo "📋 Created scan-context.json:"
        cat "$SCAN_CONTEXT_DIR/scan-context.json"

    - name: Upload Docker image artifact
      uses: actions/upload-artifact@v5
      with:
        name: __gh_security_toolkit__docker_image_for_scan__
        path: |
          /tmp/gh-security-toolkit-docker-image.tar
          /tmp/gh-security-toolkit-scan-context/scan-context.json
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        if-no-files-found: error
