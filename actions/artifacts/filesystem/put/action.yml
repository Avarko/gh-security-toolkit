name: "Upload filesystem for security scan"
description: "Uploads filesystem artifacts for security scanning. Artifact name is managed internally."
inputs:
  artifact-name-part:
    description: "Short artifact name part (e.g., 'scan-filesystem'). Will be prefixed with '__gh_security_toolkit__' and suffixed with '__'"
    required: true
  path:
    description: "Path(s) to upload. Supports glob patterns and multiple paths (one per line or comma-separated)"
    required: true
  retention-days:
    description: "Number of days to retain the artifact"
    required: false
    default: "1"
  compression-level:
    description: "Compression level (0-9). 0 = no compression (fastest), 9 = maximum compression (slowest)"
    required: false
    default: "0"

runs:
  using: "composite"
  steps:
    - name: Build artifact name
      shell: bash
      run: echo "ARTIFACT_NAME=__gh_security_toolkit__${{ inputs.artifact-name-part }}__" >> $GITHUB_ENV

    - name: Validate artifact name
      uses: Avarko/gh-security-toolkit/actions/validation/artifact-name@reactui
      with:
        artifact_name: ${{ env.ARTIFACT_NAME }}

    - name: Upload filesystem artifact
      uses: actions/upload-artifact@v5
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        if-no-files-found: error

outputs:
  artifact-name:
    description: "The artifact name used (for reference only, pass this to security-scan.yml)"
    value: ${{ env.ARTIFACT_NAME }}
