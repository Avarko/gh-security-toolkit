name: "Upload Docker image for security scan"
description: "Saves and uploads Docker image as tar file for security scanning. Artifact name is managed internally."
inputs:
  artifact_name_part:
    description: "Short artifact name part (e.g., 'docker_image'). Will be prefixed with '__gh_security_toolkit__' and suffixed with '__'"
    required: true
  image-name:
    description: "Docker image name (with tag) to save, e.g., 'myapp:latest'"
    required: true
  retention-days:
    description: "Number of days to retain the artifact"
    required: false
    default: "1"
  compression-level:
    description: "Compression level (0-9). 0 = no compression (fastest), 9 = maximum compression (slowest)"
    required: false
    default: "0"

runs:
  using: "composite"
  steps:
    - name: Build and validate artifact name
      shell: bash
      run: |
        ARTIFACT_NAME="__gh_security_toolkit__${{ inputs.artifact_name_part }}__"

        # Validate length (max 100 characters)
        if [ ${#ARTIFACT_NAME} -gt 100 ]; then
          echo "ERROR: Artifact name too long (${#ARTIFACT_NAME} characters, max 100)"
          echo "Artifact name: $ARTIFACT_NAME"
          exit 1
        fi

        # Validate characters (only alphanumeric, dash, underscore)
        if ! echo "$ARTIFACT_NAME" | grep -qE '^[a-zA-Z0-9_-]+$'; then
          echo "ERROR: Artifact name contains invalid characters (only [a-zA-Z0-9_-] allowed)"
          echo "Artifact name: $ARTIFACT_NAME"
          exit 1
        fi

        echo "Artifact name validation passed: $ARTIFACT_NAME (${#ARTIFACT_NAME} characters)"
        echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV

    - name: Save Docker image to tar
      shell: bash
      run: |
        echo "Saving Docker image: ${{ inputs.image-name }}"
        docker save "${{ inputs.image-name }}" -o /tmp/gh-security-toolkit-docker-image.tar
        echo "Image saved to /tmp/gh-security-toolkit-docker-image.tar"
        ls -lh /tmp/gh-security-toolkit-docker-image.tar

    - name: Upload Docker image artifact
      uses: actions/upload-artifact@v5
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: /tmp/gh-security-toolkit-docker-image.tar
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        if-no-files-found: error

outputs:
  artifact-name:
    description: "The artifact name used (for reference only, pass this to security-scan.yml)"
    value: ${{ env.ARTIFACT_NAME }}
