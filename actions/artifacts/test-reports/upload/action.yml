name: Upload test reports
description: |
  Uploads JaCoCo coverage reports and Surefire test reports as artifacts.
  Collects reports from standard Maven target directories.

inputs:
  jacoco-report-path:
    description: "Path to JaCoCo HTML report directory (e.g., target/site/jacoco)"
    required: false
    default: ""
  surefire-report-path:
    description: "Path to Surefire HTML report directory (e.g., target/site/surefire-report)"
    required: false
    default: ""
  channel:
    description: "Channel name for organizing reports (e.g., 'nightly', 'pr-123')"
    required: true
  retention-days:
    description: "Number of days to retain the artifact"
    required: false
    default: "1"
  custom-index-html:
    description: "Optional path to custom index.html for landing page"
    required: false
    default: ""

outputs:
  has-jacoco:
    description: "Whether JaCoCo report was included"
    value: ${{ steps.check-reports.outputs.has-jacoco }}
  has-surefire:
    description: "Whether Surefire report was included"
    value: ${{ steps.check-reports.outputs.has-surefire }}

runs:
  using: composite
  steps:
    - name: Check which reports exist
      id: check-reports
      shell: bash
      run: |
        HAS_JACOCO="false"
        HAS_SUREFIRE="false"

        if [ -n "${{ inputs.jacoco-report-path }}" ] && [ -d "${{ inputs.jacoco-report-path }}" ]; then
          echo "✅ JaCoCo report found at: ${{ inputs.jacoco-report-path }}"
          HAS_JACOCO="true"
        fi

        if [ -n "${{ inputs.surefire-report-path }}" ] && [ -d "${{ inputs.surefire-report-path }}" ]; then
          echo "✅ Surefire report found at: ${{ inputs.surefire-report-path }}"
          HAS_SUREFIRE="true"
        fi

        if [ "$HAS_JACOCO" = "false" ] && [ "$HAS_SUREFIRE" = "false" ]; then
          echo "❌ ERROR: No test reports found!"
          echo "   JaCoCo path: ${{ inputs.jacoco-report-path }}"
          echo "   Surefire path: ${{ inputs.surefire-report-path }}"
          exit 1
        fi

        echo "has-jacoco=$HAS_JACOCO" >> $GITHUB_OUTPUT
        echo "has-surefire=$HAS_SUREFIRE" >> $GITHUB_OUTPUT

    - name: Create scan context metadata
      shell: bash
      run: |
        # Create scan-context.json with metadata from GitHub Actions environment
        cat > /tmp/test-reports-scan-context.json << EOF
        {
          "channel": "${{ inputs.channel }}",
          "timestamp": "$(date -u +'%Y-%m-%d-%H%M%SZ')",
          "branch": "${GITHUB_REF_NAME:-}",
          "repository": "${GITHUB_REPOSITORY:-}",
          "commitSha": "${GITHUB_SHA:-}",
          "scanId": "${GITHUB_RUN_ID:-}",
          "ciJobName": "${GITHUB_WORKFLOW:-}",
          "ciJobUrl": "${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
          "actorName": "${GITHUB_ACTOR:-}"
        }
        EOF

        echo "📋 Created scan-context.json:"
        cat /tmp/test-reports-scan-context.json

    - name: Create site structure
      shell: bash
      run: |
        echo "📁 Creating site directory structure..."
        mkdir -p test-reports-site/coverage
        mkdir -p test-reports-site/tests

        # Include scan-context.json in the artifact
        cp /tmp/test-reports-scan-context.json test-reports-site/scan-context.json

    - name: Copy JaCoCo coverage report
      if: steps.check-reports.outputs.has-jacoco == 'true'
      shell: bash
      run: |
        echo "📊 Copying JaCoCo coverage report..."
        cp -r "${{ inputs.jacoco-report-path }}"/* test-reports-site/coverage/
        echo "   ✅ JaCoCo report copied"

    - name: Copy Surefire test report
      if: steps.check-reports.outputs.has-surefire == 'true'
      shell: bash
      run: |
        echo "🧪 Copying Surefire test report..."
        cp -r "${{ inputs.surefire-report-path }}"/* test-reports-site/tests/

        # Rename surefire.html to index.html if it exists
        if [ -f "test-reports-site/tests/surefire.html" ]; then
          mv test-reports-site/tests/surefire.html test-reports-site/tests/index.html
          echo "   ✅ Surefire report copied and renamed to index.html"
        else
          echo "   ✅ Surefire report copied"
        fi

    - name: Create landing page
      shell: bash
      run: |
        if [ -n "${{ inputs.custom-index-html }}" ] && [ -f "${{ inputs.custom-index-html }}" ]; then
          echo "📄 Using custom index.html..."
          cp "${{ inputs.custom-index-html }}" test-reports-site/index.html
        else
          echo "📄 Generating default index.html..."
          cat > test-reports-site/index.html << 'EOF'
        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Test Reports</title>
            <style>
                * { margin: 0; padding: 0; box-sizing: border-box; }
                body {
                    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
                    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                    min-height: 100vh;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    padding: 20px;
                }
                .container {
                    max-width: 800px;
                    background: white;
                    border-radius: 16px;
                    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
                    overflow: hidden;
                }
                .header {
                    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                    color: white;
                    padding: 40px;
                    text-align: center;
                }
                .header h1 {
                    font-size: 2.5rem;
                    margin-bottom: 10px;
                }
                .header p {
                    opacity: 0.9;
                    font-size: 1.1rem;
                }
                .content {
                    padding: 40px;
                }
                .report-card {
                    background: #f8f9fa;
                    border-radius: 12px;
                    padding: 30px;
                    margin-bottom: 20px;
                    transition: transform 0.2s, box-shadow 0.2s;
                    border: 2px solid #e9ecef;
                }
                .report-card:hover {
                    transform: translateY(-4px);
                    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
                    border-color: #667eea;
                }
                .report-card h2 {
                    color: #667eea;
                    font-size: 1.5rem;
                    margin-bottom: 10px;
                    display: flex;
                    align-items: center;
                    gap: 10px;
                }
                .report-card p {
                    color: #6c757d;
                    margin-bottom: 15px;
                }
                .report-card a {
                    display: inline-block;
                    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                    color: white;
                    text-decoration: none;
                    padding: 12px 24px;
                    border-radius: 8px;
                    font-weight: 600;
                    transition: transform 0.2s;
                }
                .report-card a:hover {
                    transform: scale(1.05);
                }
                .icon { font-size: 1.8rem; }
                .footer {
                    text-align: center;
                    padding: 20px;
                    color: #6c757d;
                    font-size: 0.9rem;
                }
            </style>
        </head>
        <body>
            <div class="container">
                <div class="header">
                    <h1>🧪 Test Reports</h1>
                    <p>Quality assurance and code coverage metrics</p>
                </div>
                <div class="content">
                    <div class="report-card">
                        <h2><span class="icon">📊</span> Code Coverage Report</h2>
                        <p>JaCoCo coverage analysis showing line, branch, and method coverage metrics</p>
                        <a href="./coverage/index.html">View Coverage Report →</a>
                    </div>
                    <div class="report-card">
                        <h2><span class="icon">✅</span> Test Results</h2>
                        <p>Surefire test execution report with pass/fail details and execution times</p>
                        <a href="./tests/index.html">View Test Report →</a>
                    </div>
                </div>
                <div class="footer">
                    Generated by GitHub Actions • Test Reports
                </div>
            </div>
        </body>
        </html>
        EOF
        fi
        echo "   ✅ Landing page created"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: __gh_security_toolkit__test_reports__
        path: test-reports-site
        if-no-files-found: error
        retention-days: ${{ inputs.retention-days }}
        compression-level: 6

    - name: Summary
      shell: bash
      run: |
        echo "## 📦 Test Reports Uploaded" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Artifact Name:** \`__gh_security_toolkit__test_reports__\`" >> $GITHUB_STEP_SUMMARY
        echo "**Retention:** ${{ inputs.retention-days }} days" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Included Reports:" >> $GITHUB_STEP_SUMMARY
        if [ "${{ steps.check-reports.outputs.has-jacoco }}" = "true" ]; then
          echo "- ✅ JaCoCo Coverage Report" >> $GITHUB_STEP_SUMMARY
        fi
        if [ "${{ steps.check-reports.outputs.has-surefire }}" = "true" ]; then
          echo "- ✅ Surefire Test Report" >> $GITHUB_STEP_SUMMARY
        fi
