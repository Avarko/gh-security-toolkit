name: 'Build Security Dashboard'
description: 'Builds the React security dashboard SPA'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '24'

outputs:
  artifact-name:
    description: 'Name of the uploaded dashboard artifact'
    value: __gh_security_toolkit__security-dashboard-build

runs:
  using: composite
  steps:
    - name: Checkout toolkit repository
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      with:
        repository: Avarko/gh-security-toolkit
        ref: main
        path: _toolkit

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      continue-on-error: true
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        cache-dependency-path: _toolkit/dashboard/package-lock.json

    - name: Install dependencies
      shell: bash
      run: |
        set -euo pipefail
        cd _toolkit/dashboard
        npm ci

    - name: Build dashboard
      shell: bash
      run: |
        set -euo pipefail
        cd _toolkit/dashboard
        npm run build
        echo "✅ Dashboard build complete"
        # Vite build output
        ls -lh dist/

    - name: Upload dashboard artifact
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
      with:
        name: __gh_security_toolkit__security-dashboard-build
        path: _toolkit/dashboard/dist
        retention-days: 1
