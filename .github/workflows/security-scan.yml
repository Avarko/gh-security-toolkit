name: Security scan

on:
  workflow_call:
    inputs:
      # === TRIVY CONFIGURATION ===
      trivy_config:
        description: 'Path to .trivy.yaml config file (relative to filesystem_artifact root)'
        type: string
        required: false
        default: ''

      trivy_severity:
        description: 'Minimum severity to report (UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL)'
        type: string
        required: false
        default: 'MEDIUM,HIGH,CRITICAL'

      # === RELEASE NOTES ===
      release_notes_maxlength:
        description: 'Maximum length of release notes body (characters). GitHub limit is 125000, but shorter is more readable.'
        type: number
        required: false
        default: 30000

      # === PUBLISHING ===
      publish_to:
        description: 'Where to publish results: "github-release", "github-pages", or "github-release,github-pages" for both'
        type: string
        required: false
        default: 'github-pages'

      # === METADATA FOR REPORTING ===
      channel:
        description: 'Channel name for release grouping (tag-friendly, e.g., "master", "dev", "prod"). Used in tags and release retention.'
        type: string
        required: true

    secrets:
      SLACK_BOT_TOKEN:
        description: 'Slack OAuth token (xoxb-...) for notifications'
        required: false

permissions:
  contents: write    # Required: gh release create/delete, commit to ./ folder
  pages: write       # Required: deploy-pages action (if publish_to contains 'github-pages')
  id-token: write    # Required: deploy-pages OIDC authentication (if publish_to contains 'github-pages')
  actions: read      # Required: dawidd6/action-download-artifact to list workflow runs

# Concurrency: one scan per channel at a time
# Queue new scans instead of canceling - let each scan complete
concurrency:
  group: "security-scan-${{ inputs.channel }}"
  cancel-in-progress: false

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Setup directories
        id: setup
        run: |
          OUTPUT_DIR="${RUNNER_TEMP}/scan-output-${{ github.run_id }}"
          WORK_DIR="${RUNNER_TEMP}/scan-workspace-${{ github.run_id }}"
          mkdir -p "$OUTPUT_DIR" "$WORK_DIR"
          echo "output_dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"
          echo "work_dir=$WORK_DIR" >> "$GITHUB_OUTPUT"

      - name: Timestamp
        id: ts
        run: |
          # ISO 8601 timestamp for scan identification
          echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Validate channel name
        run: |
          CHANNEL="${{ inputs.channel }}"

          # Check if empty
          if [ -z "$CHANNEL" ]; then
            echo "❌ Error: channel is required but empty"
            exit 1
          fi

          # Check length (max 35 characters)
          if [ ${#CHANNEL} -gt 35 ]; then
            echo "❌ Error: channel name too long (max 35 characters): '$CHANNEL'"
            exit 1
          fi

          # Check for invalid characters (only allow: a-z, A-Z, 0-9, dash, underscore)
          if ! echo "$CHANNEL" | grep -qE '^[a-zA-Z0-9_-]+$'; then
            echo "❌ Error: channel contains invalid characters: '$CHANNEL'"
            echo "   Allowed: a-z, A-Z, 0-9, dash (-), underscore (_)"
            exit 1
          fi

          # Check it doesn't start/end with dash or underscore
          if echo "$CHANNEL" | grep -qE '^[-_]|[-_]$'; then
            echo "❌ Error: channel cannot start or end with dash/underscore: '$CHANNEL'"
            exit 1
          fi

          echo "✅ Channel name is valid: '$CHANNEL'"

      # === DOWNLOAD ARTIFACTS ===
      - name: Download filesystem artifact
        id: download_fs
        continue-on-error: true
        uses: Avarko/gh-security-toolkit/actions/artifacts/filesystem-for-scanning/download@reactui
        with:
          out-path: ${{ steps.setup.outputs.work_dir }}/filesystem

      - name: Download docker image artifact
        id: download_image
        continue-on-error: true
        uses: Avarko/gh-security-toolkit/actions/artifacts/docker-image-for-scanning/download@reactui
        with:
          out-path: ${{ steps.setup.outputs.work_dir }}/image

      - name: Find Docker image tar
        if: ${{ steps.download_image.outcome == 'success' }}
        id: find_tar
        run: |
          TAR_FILE=$(find "${{ steps.setup.outputs.work_dir }}/image" -name "*.tar" -type f | head -n1)
          echo "tar_path=$TAR_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract scan context from artifacts
        id: scan_context
        run: |
          # Look for scan-context.json in downloaded artifacts
          SCAN_CONTEXT=""
          if [ -f "${{ steps.setup.outputs.work_dir }}/filesystem/scan-context.json" ]; then
            SCAN_CONTEXT="${{ steps.setup.outputs.work_dir }}/filesystem/scan-context.json"
          elif [ -f "${{ steps.setup.outputs.work_dir }}/image/scan-context.json" ]; then
            SCAN_CONTEXT="${{ steps.setup.outputs.work_dir }}/image/scan-context.json"
          fi

          if [ -n "$SCAN_CONTEXT" ]; then
            echo "📋 Found scan-context.json:"
            cat "$SCAN_CONTEXT"
            # Copy to output directory for publisher
            cp "$SCAN_CONTEXT" "${{ steps.setup.outputs.output_dir }}/scan-context.json"
            # Extract channel for backwards compatibility
            CHANNEL=$(jq -r '.channel // empty' "$SCAN_CONTEXT")
            echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ No scan-context.json found in artifacts, using workflow input"
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "channel=${{ inputs.channel }}" >> "$GITHUB_OUTPUT"
          fi

      # === RUN TRIVY SCANS ===
      - name: Run Trivy scans
        id: trivy
        uses: Avarko/gh-security-toolkit/actions/scanner/trivy@reactui
        with:
          filesystem_path: ${{ steps.download_fs.outcome == 'success' && format('{0}/filesystem', steps.setup.outputs.work_dir) || '' }}
          docker_image_tar: ${{ steps.download_image.outcome == 'success' && steps.find_tar.outputs.tar_path || '' }}
          trivy_config: ${{ inputs.trivy_config != '' && format('{0}/filesystem/{1}', steps.setup.outputs.work_dir, inputs.trivy_config) || '' }}
          trivy_severity: ${{ inputs.trivy_severity }}
          trivy_output_dir: ${{ steps.setup.outputs.output_dir }}

      # === RUN SEMGREP SCAN ===
      - name: Run Semgrep scan
        id: semgrep
        if: ${{ steps.download_fs.outcome == 'success' }}
        uses: Avarko/gh-security-toolkit/actions/scanner/semgrep@reactui
        with:
          filesystem_path: ${{ format('{0}/filesystem', steps.setup.outputs.work_dir) }}
          semgrep_output_dir: ${{ steps.setup.outputs.output_dir }}
          semgrep_configs: "p/owasp-top-ten,p/java,p/javascript,p/dockerfile,p/terraform,p/secrets"

      # === SUMMARIZE RESULTS ===
      - name: Summarizer
        id: sum
        uses: Avarko/gh-security-toolkit/actions/summarizer@reactui
        with:
          fs_json: ${{ steps.trivy.outputs.fs_json || '' }}
          image_json: ${{ steps.trivy.outputs.image_json || '' }}
          semgrep_summary: ${{ steps.semgrep.outputs.semgrep_summary || '' }}
          dependabot_summary: ${{ steps.dependabot.outputs.dependabot_summary || '' }}
          outdir: ${{ steps.setup.outputs.output_dir }}
          maxlength: ${{ inputs.release_notes_maxlength }}
          title_vuln_fs: "Trivy (filesystem) vulnerability summary"
          title_mis_fs: "Trivy (filesystem) misconfiguration summary"
          title_vuln_img: "Trivy (image) vulnerability summary"
          title_mis_img: "Trivy (image) misconfiguration summary"

      # === PUBLISH TO GITHUB RELEASE ===
      - name: Publish to GitHub Release
        if: contains(inputs.publish_to, 'github-release')
        uses: Avarko/gh-security-toolkit/actions/publisher/github-release@reactui
        with:
          outdir: ${{ steps.setup.outputs.output_dir }}
          release_name: "Security scan ${{ inputs.channel }} ${{ steps.ts.outputs.ts }}"
          tag_name: "security-scan-${{ inputs.channel }}-${{ steps.ts.outputs.ts }}"
          body_file: ${{ steps.sum.outputs.release_body_markdown }}
          draft: "false"
          prerelease: "true"
          overwrite_tag: "false"
          channel: "security-scan-${{ inputs.channel }}"
          retention_keep: "${{ inputs.retention_keep }}"
          retention_days: "${{ inputs.retention_days }}"
          github_token: ${{ secrets.GH_TOKEN || github.token }}

      # === PUBLISH TO GITHUB PAGES ===
      - name: Publish to GitHub Pages
        if: contains(inputs.publish_to, 'github-pages')
        id: pages
        uses: Avarko/gh-security-toolkit/actions/publisher/github-pages@reactui
        with:
          github_token: ${{ secrets.GH_TOKEN || github.token }}
          outdir: ${{ steps.setup.outputs.output_dir }}
