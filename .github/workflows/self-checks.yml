# Checks that guard the toolkit's own invariants.
#
# These run on the repository itself rather than on a consumer's code. They
# exist because the failures they catch are silent: an action that interpolates
# an input into a shell script still works perfectly for every well-behaved
# value, and only misbehaves for the one that matters.
name: Self-checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The published image is checked on a schedule because that is the only
    # way its staleness surfaces: nothing about it changes when a CVE is
    # published against a binary inside it, so without this it goes unnoticed
    # until someone scans it by hand. That is how it reached 31 unpatched
    # highs -- an image eleven days old, with a fix available for every one.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actions-hygiene:
    name: Actions hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: "No expressions inside run: bodies"
        run: python3 scripts/check-no-expressions-in-run.py

      - name: Internal action references are pinned
        run: python3 scripts/check-internal-action-refs.py

      # Resolves each pin's "# v1.2.3" against the tag it names, which nothing
      # was doing: the comment is the only part of a pin a reader understands,
      # and an upload-artifact spent three majors wearing the wrong one before
      # review caught it. No token: it asks over git, which has no quota, so
      # this runs the same here as on a laptop.
      - name: Third-party pins say what they are
        run: python3 scripts/check-action-pins.py

      - name: Workflows and actions parse
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          for f in .github/workflows/*.yml actions/**/action.yml; do
            python3 -c "import sys, yaml; yaml.safe_load(open(sys.argv[1]))" "$f"
          done
          echo "All workflow and action files parse."

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The dashboard renders scan output from other repositories, so a
      # vulnerable dependency here is a vulnerability in how those results are
      # read. Production dependencies only: a finding in the test runner is
      # worth knowing about but should not block a publish.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  published-image:
    name: Published image
    # Pull requests cannot change the published image, and a contributor should
    # not see a red check for something they did not cause.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Scanned with Trivy directly rather than through the toolkit image,
      # so a vulnerability in the toolkit cannot suppress its own report.
      - name: Scan the published toolkit image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        with:
          image-ref: ghcr.io/avarko/gh-security-toolkit:main
          # Pinned rather than left to the action's default, which trailed the
          # Trivy the image itself ships and could not read it. Go writes an
          # enabled GOEXPERIMENT into the version string, so the image's own
          # Trivy identifies as go1.26.6-X:jsonv2; older Trivy turned that into
          # v1.26.6-X:jsonv2, which is not valid semver, and every stdlib
          # advisory comparison failed with "Version matching error". Each
          # failure is skipped, so that binary was reported as 0 findings
          # having had none of them evaluated -- a clean result that meant
          # nothing. A scanner auditing this image must therefore be no older
          # than the one inside it; check that before bumping the image's
          # Trivy, since that one resolves to releases/latest at build time.
          version: v0.74.0
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
