name: Clean Artifacts

on:
  workflow_call:
    inputs:
      scan_filesystem_keep:
        description: 'Number of __gh_security_toolkit__filesystem_for_scan__ artifacts to keep'
        type: number
        required: false
        default: 3
      scan_docker_image_keep:
        description: 'Number of __gh_security_toolkit__docker_image_for_scan__ artifacts to keep'
        type: number
        required: false
        default: 3
      test_reports_keep:
        description: 'Number of __gh_security_toolkit__test_reports__ artifacts to keep'
        type: number
        required: false
        default: 3
      dashboard_build_keep:
        description: 'Number of __gh_security_toolkit__security-dashboard-build artifacts to keep'
        type: number
        required: false
        default: 3
      site_history_keep:
        description: 'Number of __gh_security_toolkit__github_pages_site_data artifacts to keep'
        type: number
        required: false
        default: 3
      dashboard_deployments_keep:
        description: 'Number of __gh_security_toolkit__github_pages_deployment artifacts to keep'
        type: number
        required: false
        default: 3

permissions:
  actions: write  # Required to delete artifacts

# Prevent concurrent cleanup runs to avoid race conditions with security-scan workflow
concurrency:
  group: cleanup-artifacts-${{ github.repository }}
  cancel-in-progress: false  # Wait for previous cleanup to finish

jobs:
  clean-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Setup cleanup script
        run: |
          cat > cleanup-script.sh << 'EOF'
          #!/usr/bin/env bash
          #
          # Cleans up old GitHub Actions artifacts, keeping only N newest.
          #
          # Usage: cleanup-artifacts-by-name.sh <artifact_name> <keep_count> <repository>
          #
          # Arguments:
          #   artifact_name - Exact name of the artifact to clean (e.g., "__gh_security_toolkit__github_pages_site_data")
          #   keep_count    - Number of newest artifacts to keep (e.g., 3)
          #   repository    - GitHub repository in format "owner/repo"
          #
          # Environment:
          #   GH_TOKEN - GitHub token for artifact operations (required)

          set -euo pipefail

          if [ $# -lt 3 ]; then
              echo "Usage: $0 <artifact_name> <keep_count> <repository>"
              exit 1
          fi

          ARTIFACT_NAME="$1"
          KEEP="$2"
          REPO="$3"

          echo "🧹 Cleaning $ARTIFACT_NAME artifacts (keeping $KEEP newest)"

          # Get all artifacts with this name, sorted by creation date (newest first)
          ARTIFACT_IDS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$REPO/actions/artifacts?name=$ARTIFACT_NAME&per_page=100" \
            --jq '[.artifacts | sort_by(.created_at) | reverse | .[].id] | @json' | jq -r '.[]')

          if [ -z "$ARTIFACT_IDS" ]; then
            echo "   ℹ️  No artifacts found"
            exit 0
          fi

          # Convert to array
          mapfile -t IDS <<< "$ARTIFACT_IDS"
          TOTAL=${#IDS[@]}

          echo "   Found $TOTAL artifact(s)"

          if [ "$TOTAL" -le "$KEEP" ]; then
            echo "   ✅ No cleanup needed (total=$TOTAL, keep=$KEEP)"
            exit 0
          fi

          # Delete old artifacts (keep only the first $KEEP)
          DELETED=0
          for ((i=KEEP; i<TOTAL; i++)); do
            ARTIFACT_ID="${IDS[$i]}"
            echo "   🗑️  Deleting artifact ID: $ARTIFACT_ID"
            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/$REPO/actions/artifacts/$ARTIFACT_ID" || echo "   ⚠️  Failed to delete (may already be deleted)"
            DELETED=$((DELETED + 1))
          done

          echo "   ✅ Deleted $DELETED artifact(s), kept $KEEP newest"
          EOF
          chmod +x cleanup-script.sh

      - name: Clean filesystem artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./cleanup-script.sh \
            "__gh_security_toolkit__filesystem_for_scan__" \
            "${{ inputs.scan_filesystem_keep || 3 }}" \
            "Avarko/gh-security-toolkit"

      - name: Clean Docker image artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./cleanup-script.sh \
            "__gh_security_toolkit__docker_image_for_scan__" \
            "${{ inputs.scan_docker_image_keep || 3 }}" \
            "Avarko/gh-security-toolkit"

      - name: Clean test reports artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./cleanup-script.sh \
            "__gh_security_toolkit__test_reports__" \
            "${{ inputs.test_reports_keep || 3 }}" \
            "Avarko/gh-security-toolkit"

      - name: Clean dashboard build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./cleanup-script.sh \
            "__gh_security_toolkit__security-dashboard-build" \
            "${{ inputs.dashboard_build_keep || 3 }}" \
            "Avarko/gh-security-toolkit"

      - name: Clean site data history artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./cleanup-script.sh \
            "__gh_security_toolkit__github_pages_site_data" \
            "${{ inputs.site_history_keep || 3 }}" \
            "Avarko/gh-security-toolkit"

      - name: Clean multi-tenant config artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./cleanup-script.sh \
            "__gh_security_toolkit__multi-tenant-config" \
            "1" \
            "Avarko/gh-security-toolkit"

      - name: Clean dashboard pages artifacts (all channels)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./cleanup-script.sh \
            "__gh_security_toolkit__github_pages_deployment" \
            "${{ inputs.dashboard_deployments_keep || 3 }}" \
            "Avarko/gh-security-toolkit"

      - name: Cleanup summary
        run: |
          echo "✅ Artifact cleanup complete for Avarko/gh-security-toolkit!"
          echo ""
          echo "Retention policy applied:"
          echo "  • __gh_security_toolkit__filesystem_for_scan__: keep ${{ inputs.scan_filesystem_keep || 3 }} newest"
          echo "  • __gh_security_toolkit__docker_image_for_scan__: keep ${{ inputs.scan_docker_image_keep || 3 }} newest"
          echo "  • __gh_security_toolkit__test_reports__: keep ${{ inputs.test_reports_keep || 3 }} newest"
          echo "  • __gh_security_toolkit__security-dashboard-build: keep ${{ inputs.dashboard_build_keep || 3 }} newest"
          echo "  • __gh_security_toolkit__github_pages_site_data: keep ${{ inputs.site_history_keep || 3 }} newest"
          echo "  • __gh_security_toolkit__multi-tenant-config: keep 1 newest (tenant registry)"
          echo "  • __gh_security_toolkit__github_pages_deployment: keep ${{ inputs.dashboard_deployments_keep || 3 }} newest per channel"
