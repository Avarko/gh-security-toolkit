name: Clean Artifacts

on:
  workflow_call:
    inputs:
      scan_filesystem_keep:
        description: 'Number of __gh_security_toolkit__filesystem_for_scan__ artifacts to keep'
        type: number
        required: false
        default: 3
      scan_docker_image_keep:
        description: 'Number of __gh_security_toolkit__docker_image_for_scan__ artifacts to keep'
        type: number
        required: false
        default: 3
      test_reports_keep:
        description: 'Number of __gh_security_toolkit__test_reports__ artifacts to keep'
        type: number
        required: false
        default: 3
      dashboard_build_keep:
        description: 'Number of __gh_security_toolkit__security-dashboard-build artifacts to keep'
        type: number
        required: false
        default: 3
      site_history_keep:
        description: 'Number of __gh_security_toolkit__github_pages_site_data artifacts to keep'
        type: number
        required: false
        default: 3
      dashboard_deployments_keep:
        description: 'Number of __gh_security_toolkit__github_pages_deployment artifacts to keep'
        type: number
        required: false
        default: 3

  workflow_dispatch:
    inputs:
      scan_filesystem_keep:
        description: 'Number of __gh_security_toolkit__filesystem_for_scan__ artifacts to keep'
        type: number
        required: false
        default: 3
      scan_docker_image_keep:
        description: 'Number of __gh_security_toolkit__docker_image_for_scan__ artifacts to keep'
        type: number
        required: false
        default: 3
      test_reports_keep:
        description: 'Number of __gh_security_toolkit__test_reports__ artifacts to keep'
        type: number
        required: false
        default: 3
      dashboard_build_keep:
        description: 'Number of __gh_security_toolkit__security-dashboard-build artifacts to keep'
        type: number
        required: false
        default: 3
      site_history_keep:
        description: 'Number of __gh_security_toolkit__github_pages_site_data artifacts to keep'
        type: number
        required: false
        default: 3
      dashboard_deployments_keep:
        description: 'Number of __gh_security_toolkit__github_pages_deployment artifacts to keep'
        type: number
        required: false
        default: 3

permissions:
  actions: write  # Required to delete artifacts

# Prevent concurrent cleanup runs to avoid race conditions with security-scan workflow
concurrency:
  group: cleanup-artifacts-${{ github.repository }}
  cancel-in-progress: false  # Wait for previous cleanup to finish

jobs:
  clean-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean filesystem artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ${{ github.workspace }}/.github/workflows/scripts/cleanup-artifacts-by-name.sh \
            "__gh_security_toolkit__filesystem_for_scan__" \
            "${{ inputs.scan_filesystem_keep || 3 }}" \
            "${{ github.repository }}"

      - name: Clean Docker image artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ${{ github.workspace }}/.github/workflows/scripts/cleanup-artifacts-by-name.sh \
            "__gh_security_toolkit__docker_image_for_scan__" \
            "${{ inputs.scan_docker_image_keep || 3 }}" \
            "${{ github.repository }}"

      - name: Clean test reports artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ${{ github.workspace }}/.github/workflows/scripts/cleanup-artifacts-by-name.sh \
            "__gh_security_toolkit__test_reports__" \
            "${{ inputs.test_reports_keep || 3 }}" \
            "${{ github.repository }}"

      - name: Clean dashboard build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ${{ github.workspace }}/.github/workflows/scripts/cleanup-artifacts-by-name.sh \
            "__gh_security_toolkit__security-dashboard-build" \
            "${{ inputs.dashboard_build_keep || 3 }}" \
            "${{ github.repository }}"

      - name: Clean site data history artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ${{ github.workspace }}/.github/workflows/scripts/cleanup-artifacts-by-name.sh \
            "__gh_security_toolkit__github_pages_site_data" \
            "${{ inputs.site_history_keep || 3 }}" \
            "${{ github.repository }}"

      - name: Clean multi-tenant config artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ${{ github.workspace }}/.github/workflows/scripts/cleanup-artifacts-by-name.sh \
            "__gh_security_toolkit__multi-tenant-config" \
            "3" \
            "${{ github.repository }}"

      - name: Clean dashboard pages artifacts (all channels)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ${{ github.workspace }}/.github/workflows/scripts/cleanup-artifacts-by-name.sh \
            "__gh_security_toolkit__github_pages_deployment" \
            "3" \
            "${{ github.repository }}"

      - name: Cleanup summary
        run: |
          echo "✅ Artifact cleanup complete!"
          echo ""
          echo "Retention policy applied:"
          echo "  • __gh_security_toolkit__filesystem_for_scan__: keep ${{ inputs.scan_filesystem_keep || 3 }} newest"
          echo "  • __gh_security_toolkit__docker_image_for_scan__: keep ${{ inputs.scan_docker_image_keep || 3 }} newest"
          echo "  • __gh_security_toolkit__test_reports__: keep ${{ inputs.test_reports_keep || 3 }} newest"
          echo "  • __gh_security_toolkit__security-dashboard-build: keep ${{ inputs.dashboard_build_keep || 3 }} newest"
          echo "  • __gh_security_toolkit__github_pages_site_data: keep ${{ inputs.site_history_keep || 3 }} newest"
          echo "  • __gh_security_toolkit__multi-tenant-config: keep 3 newest (tenant registry)"
          echo "  • __gh_security_toolkit__github_pages_deployment: keep 3 newest per channel"
