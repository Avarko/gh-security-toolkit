name: "[Internal] Release CLI Docker image manually"

on:
  workflow_dispatch:
    inputs:
      docker-image-tag:
        description: 'Release tag (e.g., v1.2.3)'
        required: true
        default: 'manual-latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: avarko/gh-security-toolkit
  CONTEXT: ./cli

jobs:
  build:
    name: Build & push image
    if: github.repository == 'Avarko/gh-security-toolkit'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push to GHCR
    outputs:
      image_ref: ${{ steps.expose.outputs.image_ref }}
      image_digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Add support for more platforms with QEMU (optional)
      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest only moves for builds from the default branch. A build from
          # a feature branch would otherwise repoint the tag every other
          # project pulls, which is not what testing a branch should do.
          tags: |
            type=raw,value=${{ github.event.inputs.docker-image-tag }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Expose image ref for downstream jobs
        id: expose
        run: echo "image_ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      # ---------- Resolve, verify, and download tool binaries ----------

      - name: Install SLSA verifier
        run: |
          curl -sL https://github.com/slsa-framework/slsa-verifier/releases/latest/download/slsa-verifier-linux-amd64 \
            -o /usr/local/bin/slsa-verifier && chmod +x /usr/local/bin/slsa-verifier

      - name: Prepare binaries directory
        env:
          CONTEXT: ${{ env.CONTEXT }}
        run: |
          set -euo pipefail
          mkdir -p \
            "${CONTEXT}/verified-binaries/linux-amd64" \
            "${CONTEXT}/verified-binaries/linux-arm64" \
            "${CONTEXT}/verified-binaries/trivy-db"

      - name: Install jq & openssl
        run: sudo apt-get update && sudo apt-get install -y jq openssl

      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'

      # https://docs.sigstore.dev/cosign/system_config/installation/
      - name: Resolve & verify Cosign (bundle)
        id: cosign
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTEXT: ${{ env.CONTEXT }}
        run: |
          set -euo pipefail
          CONTEXT="${CONTEXT}"

          ver_cosign=$(gh api repos/sigstore/cosign/releases/latest --jq .tag_name)
          echo "ver_cosign=$ver_cosign" >> "$GITHUB_OUTPUT"

          # Sigstore TUF bootstrap
          go install github.com/theupdateframework/go-tuf/cmd/tuf-client@latest
          curl -o sigstore-root.json https://raw.githubusercontent.com/sigstore/root-signing/refs/heads/main/metadata/root_history/10.root.json
          tuf-client init https://tuf-repo-cdn.sigstore.dev sigstore-root.json
          tuf-client get https://tuf-repo-cdn.sigstore.dev artifact.pub > artifact.pub

          for arch in amd64 arm64; do
            COSIGN_FILE="cosign-linux-${arch}"
            SIG_JSON="${COSIGN_FILE}-kms.sigstore.json"

            echo "Downloading cosign for $arch: ${COSIGN_FILE}"
            curl -L -o "${SIG_JSON}" "https://github.com/sigstore/cosign/releases/download/${ver_cosign}/${SIG_JSON}"
            jq -r '.messageSignature.signature' "${SIG_JSON}" | base64 -d > "cosign-${arch}.sig.decoded"

            curl -L -o "${COSIGN_FILE}" "https://github.com/sigstore/cosign/releases/download/${ver_cosign}/${COSIGN_FILE}"

            echo "Verifying cosign (${arch}) with artifact.pub"
            openssl dgst -sha256 -verify artifact.pub -signature "cosign-${arch}.sig.decoded" "${COSIGN_FILE}"

            install -m 0755 "${COSIGN_FILE}" "${CONTEXT}/verified-binaries/linux-${arch}/cosign"
          done

      - name: Initialize Sigstore TUF and archive cache (for offline / air gapped image)
        env:
          CONTEXT: ${{ env.CONTEXT }}
        run: |
          set -euo pipefail
          COSIGN_BIN="${CONTEXT}/verified-binaries/linux-amd64/cosign"
          COSIGN_HOME="${CONTEXT}/verified-binaries/cosign-home"
          mkdir -p "$COSIGN_HOME"
          HOME="$COSIGN_HOME" "$COSIGN_BIN" initialize --output-file "$COSIGN_HOME/cosign-init.log"
          tar -C "$COSIGN_HOME" -czf "${CONTEXT}/verified-binaries/tuf-cache.tgz" .sigstore cosign-init.log

      - name: Resolve & verify Crane (SLSA provenance)
        id: crane
        env:
          CONTEXT: ${{ env.CONTEXT }}
        run: |
          set -euo pipefail
          CONTEXT="${CONTEXT}"

          # Pinned rather than resolved to releases/latest, because here newer
          # is not automatically safer. v0.22.0 dropped upstream's .go-version
          # file in favour of go.mod's toolchain directive, but their release
          # workflow sets GOTOOLCHAIN=local -- and setup-go skips the toolchain
          # directive when that is set, falling back to the `go` directive.
          # That one is a minimum-version floor, then reading 1.25.0, so
          # v0.22.0 shipped built with go1.25.0 where v0.21.9 had shipped
          # go1.26.5, carrying 14 extra unpatched stdlib highs. We held at
          # v0.21.9 and waited for upstream to notice.
          #
          # They did. v0.22.1 declares `toolchain go1.26.6`, and both published
          # Linux binaries verify as built with it, which clears the eight
          # stdlib highs v0.21.9's go1.26.5 had accumulated by then. The pin
          # stays a pin: what went wrong in v0.22.0 can recur the same way and
          # just as quietly, since the floor only moves when upstream drops
          # support for an old Go. Before bumping, check the candidate by hand
          # -- download the release and run `go version -m crane`, which has to
          # name a toolchain covering the current stdlib advisories. go.mod
          # alone does not settle it; the v0.22.0 build disagreed with what its
          # own go.mod asked for, and that is the whole reason for this pin.
          ver_crane=v0.22.1
          echo "ver_crane=$ver_crane" >> "$GITHUB_OUTPUT"

          curl -sL "https://github.com/google/go-containerregistry/releases/download/${ver_crane}/multiple.intoto.jsonl" -o crane-provenance.intoto.jsonl

          for arch in amd64 arm64; do
            case "$arch" in
              amd64) TARBALL="go-containerregistry_Linux_x86_64.tar.gz" ;;
              arm64) TARBALL="go-containerregistry_Linux_arm64.tar.gz" ;;
            esac

            echo "Downloading crane for $arch: $TARBALL"
            curl -sL "https://github.com/google/go-containerregistry/releases/download/${ver_crane}/${TARBALL}" -o "crane-${arch}.tgz"

            echo "Verifying crane (${arch}) with SLSA provenance"
            slsa-verifier verify-artifact "crane-${arch}.tgz" \
              --provenance-path crane-provenance.intoto.jsonl \
              --source-uri github.com/google/go-containerregistry \
              --source-tag "${ver_crane}"

            tar -xzf "crane-${arch}.tgz" crane
            install -m 0755 crane "${CONTEXT}/verified-binaries/linux-${arch}/crane"
          done

      - name: Resolve Trivy
        id: trivy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTEXT: ${{ env.CONTEXT }}
        run: |
          set -euo pipefail
          CONTEXT="${CONTEXT}"
          COSIGN_BIN="${CONTEXT}/verified-binaries/linux-amd64/cosign"

          ver_trivy=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/aquasecurity/trivy/releases/latest | grep -oP 'tag/\K.+')
          echo "ver_trivy=$ver_trivy" >> "$GITHUB_OUTPUT"

          for arch in amd64 arm64; do
            case "$arch" in
              amd64)
                TARBALL="trivy_${ver_trivy#v}_Linux-64bit.tar.gz"
                ;;
              arm64)
                TARBALL="trivy_${ver_trivy#v}_Linux-ARM64.tar.gz"
                ;;
            esac

            echo "Downloading Trivy for $arch: $TARBALL"
            curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/${ver_trivy}/${TARBALL}" -o "${TARBALL}"

            # Try old format (.sig + .pem) first, fallback to new format (.sigstore.json)
            if curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/${ver_trivy}/${TARBALL}.sig" -o "${TARBALL}.sig" 2>/dev/null && \
               curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/${ver_trivy}/${TARBALL}.pem" -o "${TARBALL}.pem" 2>/dev/null; then
              echo "Using legacy signature format (.sig + .pem)"
              "$COSIGN_BIN" verify-blob "${TARBALL}" \
                --certificate "${TARBALL}.pem" \
                --signature "${TARBALL}.sig" \
                --certificate-identity-regexp 'https://github\.com/aquasecurity/trivy/\.github/workflows/.+' \
                --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
            else
              echo "Legacy format not found, using Sigstore bundle format (.sigstore.json)"
              curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/${ver_trivy}/${TARBALL}.sigstore.json" -o "${TARBALL}.sigstore.json"
              "$COSIGN_BIN" verify-blob "${TARBALL}" \
                --bundle "${TARBALL}.sigstore.json" \
                --certificate-identity-regexp 'https://github\.com/aquasecurity/trivy/\.github/workflows/.+' \
                --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
            fi

            tar -xzf "${TARBALL}" trivy
            install -m 0755 trivy "${CONTEXT}/verified-binaries/linux-${arch}/trivy"
          done

      # The vulnerability databases are deliberately NOT baked in. They used to
      # be, at ~2.8 GB of image, and going stale forced a full re-pull. They
      # now come from the shared host cache that Makefile.scanners mounts,
      # updated incrementally by `make sec/db/update`.
      #
      # The misconfiguration checks are a different matter: they are a few MB
      # of Rego policies that `trivy config` needs, they change rarely, and
      # they have no incremental mechanism. Those stay in the image.
      - name: Download Trivy misconfiguration checks
        id: trivy-checks
        env:
          CONTEXT: ${{ env.CONTEXT }}
        run: |
          set -euo pipefail
          CONTEXT="${CONTEXT}"
          TRIVY_BIN="${CONTEXT}/verified-binaries/linux-amd64/trivy"
          TRIVY_DB_DIR="${CONTEXT}/verified-binaries/trivy-db"

          mkdir -p "$TRIVY_DB_DIR"
          "$TRIVY_BIN" --cache-dir "$TRIVY_DB_DIR" fs /dev/null --scanners misconfig 2>/dev/null || true

          # Fail loudly rather than shipping an image whose vulnerability
          # databases were pulled in by accident.
          if [ -f "$TRIVY_DB_DIR/db/trivy.db" ] || [ -f "$TRIVY_DB_DIR/java-db/trivy-java.db" ]; then
            echo "::error::Vulnerability databases must not be baked into the image"
            exit 1
          fi

          echo "Checks bundled: $(du -sh "$TRIVY_DB_DIR" | cut -f1)"

      # The helper applies incremental database updates on the client. It is
      # published as a public OCI artifact by the database pipeline, whose
      # repository stays private: on GitHub a package's visibility is
      # independent of its repository's, so the artifacts are anonymously
      # pullable while the source is not. No token is needed here, and none is
      # needed by developers at scan time either.
      - name: Fetch database helper
        id: db-helper
        env:
          HELPER_PKG: ghcr.io/avarko/trivy-incremental-dbs
          CONTEXT: ${{ env.CONTEXT }}
        run: |
          set -euo pipefail
          CONTEXT="${CONTEXT}"
          CRANE="${CONTEXT}/verified-binaries/linux-amd64/crane"

          # helper-latest is moved by the publishing pipeline, so the image
          # always picks up the current client. Resolve it to a concrete
          # version, which is passed to the build as HELPER_VER and ends up as
          # an image label: the build log expires and cannot be read from a
          # developer's terminal, so the version has to travel with the image.
          version=$("$CRANE" ls "$HELPER_PKG" | grep '^helper-v' | sort -V | tail -1)
          echo "helper_version=$version" >> "$GITHUB_OUTPUT"
          echo "Using database helper $version (via helper-latest)"

          # These are OCI artifacts rather than container images, so pull the
          # layer blob directly instead of exporting a filesystem.
          workdir=$(mktemp -d)
          digest=$("$CRANE" manifest "${HELPER_PKG}:${version}" \
            | jq -r '.layers[] | select(.mediaType | startswith("application/vnd.evolver.trivy.helper")) | .digest')
          "$CRANE" blob "${HELPER_PKG}@${digest}" | tar -xz -C "$workdir"

          # Verify against the checksums published alongside the binaries, so
          # a tampered artifact cannot reach the image unnoticed.
          for arch in amd64 arm64; do
            dest="${CONTEXT}/verified-binaries/linux-${arch}"
            mkdir -p "$dest"
            install -m 0755 "${workdir}/trivy-db-helper-linux-${arch}" "${dest}/trivy-db-helper"

            expected=$(grep "trivy-db-helper-linux-${arch}\$" "${workdir}/checksums.txt" | awk '{print $1}')
            actual=$(sha256sum "${dest}/trivy-db-helper" | awk '{print $1}')
            if [ "$expected" != "$actual" ]; then
              echo "::error::Checksum mismatch for linux-${arch} database helper"
              exit 1
            fi
          done

          rm -rf "$workdir"
          echo "Helper checksums verified"

      - name: Resolve TruffleHog
        id: trufflehog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTEXT: ${{ env.CONTEXT }}
        run: |
          set -euo pipefail
          CONTEXT="${CONTEXT}"
          COSIGN_BIN="${CONTEXT}/verified-binaries/linux-amd64/cosign"

          ver_trufflehog=$(gh api repos/trufflesecurity/trufflehog/releases/latest --jq .tag_name)
          echo "ver_trufflehog=$ver_trufflehog" >> "$GITHUB_OUTPUT"

          CHECKSUMS="trufflehog_${ver_trufflehog#v}_checksums.txt"
          CHECKSUMS_SIG="${CHECKSUMS}.sig"
          CHECKSUMS_PEM="${CHECKSUMS}.pem"

          curl -fsSL "https://github.com/trufflesecurity/trufflehog/releases/download/${ver_trufflehog}/${CHECKSUMS}" -o "${CHECKSUMS}"
          curl -fsSL "https://github.com/trufflesecurity/trufflehog/releases/download/${ver_trufflehog}/${CHECKSUMS_SIG}" -o "${CHECKSUMS_SIG}"
          curl -fsSL "https://github.com/trufflesecurity/trufflehog/releases/download/${ver_trufflehog}/${CHECKSUMS_PEM}" -o "${CHECKSUMS_PEM}"

          "$COSIGN_BIN" verify-blob "${CHECKSUMS}" \
            --certificate "${CHECKSUMS_PEM}" \
            --signature "${CHECKSUMS_SIG}" \
            --certificate-identity-regexp 'https://github\.com/trufflesecurity/trufflehog/\.github/workflows/.+' \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

          # Ladataan molemmat arkkitehtuurit ja varmistetaan sha256sum
          for arch in amd64 arm64; do
            TARBALL="trufflehog_${ver_trufflehog#v}_linux_${arch}.tar.gz"
            echo "Downloading TruffleHog for $arch: $TARBALL"
            curl -fsSL "https://github.com/trufflesecurity/trufflehog/releases/download/${ver_trufflehog}/${TARBALL}" -o "${TARBALL}"

            sha256sum --ignore-missing -c "${CHECKSUMS}"

            tar -xzf "${TARBALL}" trufflehog
            install -m 0755 trufflehog "${CONTEXT}/verified-binaries/linux-${arch}/trufflehog"
          done

      # ---------- Build & push with verified binaries ----------
      - name: Build & push (provenance disabled here)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.CONTEXT }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          platforms: linux/amd64,linux/arm64
          build-args: |
            TRIVY_VER=${{ steps.trivy.outputs.ver_trivy }}
            TRUFFLEHOG_VER=${{ steps.trufflehog.outputs.ver_trufflehog }}
            COSIGN_VER=${{ steps.cosign.outputs.ver_cosign }}
            CRANE_VER=${{ steps.crane.outputs.ver_crane }}
            HELPER_VER=${{ steps.db-helper.outputs.helper_version }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  sbom:
    name: Generate SBOM and attestation
    if: github.repository == 'Avarko/gh-security-toolkit'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # push SBOM to GHCR
      id-token: write      # OIDC for signing
      attestations: write  # GitHub Attestations store
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ needs.build.outputs.image_ref }}@${{ needs.build.outputs.image_digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Generate SBOM attestation
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ needs.build.outputs.image_ref }}
          subject-digest: ${{ needs.build.outputs.image_digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

  provenance_oci:
    name: Generate SLSA v3 OCI provenance
    if: github.repository == 'Avarko/gh-security-toolkit'
    needs: [build]
    # Writes an OCI attestation alongside the image in GHCR
    permissions:
      contents: read
      actions: read
      id-token: write    # OIDC for signing
      packages: write    # push attestation to GHCR
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.build.outputs.image_ref }}
      digest: ${{ needs.build.outputs.image_digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  provenance_github_store:
    name: GitHub Attestations store (duplicate provenance)
    if: github.repository == 'Avarko/gh-security-toolkit'
    needs: [build]
    runs-on: ubuntu-latest
    # Persists provenance in GitHub's Attestations store, useful for GH UI/API & org policies
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ needs.build.outputs.image_ref }}
          subject-digest: ${{ needs.build.outputs.image_digest }}

  verify:
    name: Verify OCI provenance
    if: github.repository == 'Avarko/gh-security-toolkit'
    needs: [build, provenance_oci]
    runs-on: ubuntu-latest
    permissions: read-all
    steps:
      - name: Install SLSA verifier
        uses: slsa-framework/slsa-verifier/actions/installer@v2.7.1

      - name: Verify OCI provenance
        env:
          NEEDS_BUILD_IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          NEEDS_BUILD_IMAGE_REF: ${{ needs.build.outputs.image_ref }}
        run: |
          set -euo pipefail
          IMG="${NEEDS_BUILD_IMAGE_REF}@${NEEDS_BUILD_IMAGE_DIGEST}"
          echo "Verifying SLSA provenance for $IMG"

          # SLSA verifier requires either a git tag or uses commit SHA
          # Since manual-latest is not a git tag, verify against commit SHA
          slsa-verifier verify-image "$IMG" \
            --source-uri "github.com/${GITHUB_REPOSITORY}" \
            --print-provenance

  verify_github_store:
    name: Verify GitHub Attestations presence
    if: github.repository == 'Avarko/gh-security-toolkit'
    needs: [build, provenance_github_store, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify attestations via GH CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEEDS_BUILD_IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          NEEDS_BUILD_IMAGE_REF: ${{ needs.build.outputs.image_ref }}
        run: |
          # Use oci:// prefix for container images
          SUBJECT="oci://${NEEDS_BUILD_IMAGE_REF}@${NEEDS_BUILD_IMAGE_DIGEST}"

          echo "Verifying attestations for: $SUBJECT"

          # Verify attestation (checks both provenance and SBOM)
          gh attestation verify "$SUBJECT" \
            --owner ${GITHUB_REPOSITORY_OWNER} \
            && echo "✅ Attestations verified successfully!" \
            || (echo "❌ No valid attestation found" && exit 1)