name: "[Internal] Release CLI Docker image manually"

on:
  workflow_dispatch:
    inputs:
      docker-image-tag:
        description: 'Release tag (e.g., v1.2.3)'
        required: true
        default: 'manual-latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: avarko/gh-security-toolkit
  CONTEXT: ./cli

# One build at a time. The merge job reads the index digest back through a
# tag, and two overlapping runs with the same tag would attest each other's
# image.
concurrency:
  group: build-scanner-cli
  cancel-in-progress: false

jobs:
  # Three jobs where there was one, so that no emulator takes part in
  # building the image. The single job built both architectures on an amd64
  # runner, which needed QEMU to run every arm64 RUN step: an image pulled at
  # build time, running privileged, executing the build after every checksum
  # and signature check here had passed. Now each architecture builds on a
  # native runner (ubuntu-24.04-arm is free for public repositories), the
  # binaries are verified once and handed to both, and the two images are
  # joined into one multi-arch tag at the end.
  prepare:
    name: Verify tool binaries
    if: github.repository == 'Avarko/gh-security-toolkit'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      ver_trivy: ${{ steps.trivy.outputs.ver_trivy }}
      ver_trufflehog: ${{ steps.trufflehog.outputs.ver_trufflehog }}
      ver_cosign: ${{ steps.cosign.outputs.ver_cosign }}
      ver_crane: ${{ steps.crane.outputs.ver_crane }}
      ver_semgrep: ${{ steps.semgrep.outputs.ver_semgrep }}
      helper_version: ${{ steps.db-helper.outputs.helper_version }}
      binaries_sha256: ${{ steps.handoff.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # ---------- Resolve, verify, and download tool binaries ----------

      - name: Prepare binaries directory
        env:
          CONTEXT: ${{ env.CONTEXT }}
        run: |
          set -euo pipefail
          mkdir -p \
            "${CONTEXT}/verified-binaries/linux-amd64" \
            "${CONTEXT}/verified-binaries/linux-arm64" \
            "${CONTEXT}/verified-binaries/trivy-db"

      - name: Install jq, openssl & patchelf
        run: sudo apt-get update && sudo apt-get install -y jq openssl patchelf

      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          # A supported release: tuf-client is what fetches the key every
          # cosign binary here is verified with, and crane is compiled with
          # it, so its patch level is the stdlib crane ships with.
          # check-latest: the newest 1.27.x in actions/go-versions rather than
          # a copy cached on the runner image, which can trail a Go security
          # release. If that manifest cannot be fetched, setup-go falls back to
          # the cached copy with only an info line; crane's image label records
          # the Go actually used, so `scanx provenance` shows it either way.
          go-version: '1.27.x'
          check-latest: true
          # Only tuf-client and crane are built, and there is no go.mod here
          # to key a cache.
          cache: false

      # https://docs.sigstore.dev/cosign/system_config/installation/
      - name: Resolve & verify Cosign (bundle)
        id: cosign
        env:
          CONTEXT: ${{ env.CONTEXT }}
        run: |
          set -euo pipefail
          CONTEXT="${CONTEXT}"

          # Pinned by version and by the sha256 of each binary, like every
          # tool in the image: resolving releases/latest put whatever was newest
          # on the day of the build into the image, unreviewed. See "Pinned
          # components" in AGENTS.md before bumping.
          #
          # v3.1.4 (2026-10-20) replaced v3.1.3, which by then carried 25
          # highs (go1.26.4, x/crypto, x/mod, x/net, x/text, grpc v1.82.0,
          # go-jose, klauspost/compress). v3.1.4 is built with go1.27.3 and
          # ships 1: x/net v0.61.0 CVE-2026-78661, fixed in v0.62.0, which no
          # cosign release ships yet. Pinned at 20 days old, short of the
          # three-week rule, because it removes 24 highs nothing older does.
          ver_cosign=v3.1.4
          sha_cosign_amd64=424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
          sha_cosign_arm64=ade83b7aac62e131cacfe96d958948b2150cc9efec46a570a2649b8e27dedad2
          echo "ver_cosign=$ver_cosign" >> "$GITHUB_OUTPUT"

          # Sigstore TUF bootstrap: the key every cosign binary below is
          # verified with comes from here, so both inputs are pinned like the
          # binaries. tuf-client v0.7.0 is what @latest resolved to; go-tuf's
          # v1 module has been frozen there since 2023 (development moved to
          # /v2), and go install checks it against sum.golang.org. The trusted
          # root is read at the commit that last changed it rather than from
          # main, and checked by hash: it is where all of this trust starts.
          go install github.com/theupdateframework/go-tuf/cmd/tuf-client@v0.7.0
          curl -fsSL -o sigstore-root.json https://raw.githubusercontent.com/sigstore/root-signing/03f9c7e0023c917b60eb7431e87f47e6a636f37a/metadata/root_history/10.root.json
          echo "836bff947925edfc23eb9ce17af66fb1e43bb5e2bdd240520985ae52b585eae9  sigstore-root.json" | sha256sum -c -
          tuf-client init https://tuf-repo-cdn.sigstore.dev sigstore-root.json
          tuf-client get https://tuf-repo-cdn.sigstore.dev artifact.pub > artifact.pub

          for arch in amd64 arm64; do
            COSIGN_FILE="cosign-linux-${arch}"
            SIG_JSON="${COSIGN_FILE}-kms.sigstore.json"

            echo "Downloading cosign for $arch: ${COSIGN_FILE}"
            curl -fsSL -o "${SIG_JSON}" "https://github.com/sigstore/cosign/releases/download/${ver_cosign}/${SIG_JSON}"
            jq -r '.messageSignature.signature' "${SIG_JSON}" | base64 -d > "cosign-${arch}.sig.decoded"

            curl -fsSL -o "${COSIGN_FILE}" "https://github.com/sigstore/cosign/releases/download/${ver_cosign}/${COSIGN_FILE}"

            expected_var="sha_cosign_${arch}"
            echo "${!expected_var}  ${COSIGN_FILE}" | sha256sum -c -

            echo "Verifying cosign (${arch}) with artifact.pub"
            openssl dgst -sha256 -verify artifact.pub -signature "cosign-${arch}.sig.decoded" "${COSIGN_FILE}"

            install -m 0755 "${COSIGN_FILE}" "${CONTEXT}/verified-binaries/linux-${arch}/cosign"
          done

      - name: Initialize Sigstore TUF and archive cache (for offline / air gapped image)
        env:
          CONTEXT: ${{ env.CONTEXT }}
        run: |
          set -euo pipefail
          COSIGN_BIN="${CONTEXT}/verified-binaries/linux-amd64/cosign"
          COSIGN_HOME="${CONTEXT}/verified-binaries/cosign-home"
          mkdir -p "$COSIGN_HOME"
          HOME="$COSIGN_HOME" "$COSIGN_BIN" initialize --output-file "$COSIGN_HOME/cosign-init.log"
          tar -C "$COSIGN_HOME" -czf "${CONTEXT}/verified-binaries/tuf-cache.tgz" .sigstore cosign-init.log

      - name: Build Crane from source
        id: crane
        env:
          CONTEXT: ${{ env.CONTEXT }}
        run: |
          set -euo pipefail
          CONTEXT="${CONTEXT}"

          # Built here from the release tag rather than downloaded, so the
          # binary carries this job's Go (setup-go above, 1.27.x, check-latest)
          # instead of whatever toolchain upstream released it with. Their
          # v0.22.1 binaries are go1.26.6, and Go's own fixes since then
          # (crypto/x509 CVE-2026-111943 among them) reach a downloaded crane
          # only when upstream cuts a new release; v0.22.0 had even shipped
          # with go1.25.0 against its own go.mod. go install fetches the tag's
          # module and its dependencies through the Go module proxy and checks
          # every one against sum.golang.org, the same way tuf-client above is
          # trusted. The tag stays a pin: bump it when upstream releases.
          ver_crane=v0.22.1
          # The label records the Go that built it, as the release no longer does.
          echo "ver_crane=$ver_crane ($(go env GOVERSION))" >> "$GITHUB_OUTPUT"

          gobin="$(go env GOPATH)/bin"
          for arch in amd64 arm64; do
            echo "Building crane ${ver_crane} for ${arch} with $(go env GOVERSION)"
            # GOTOOLCHAIN=local: the Go set up above, never one a go.mod switches to.
            GOTOOLCHAIN=local GOOS=linux GOARCH="$arch" CGO_ENABLED=0 \
              go install -trimpath -ldflags='-s -w' "github.com/google/go-containerregistry/cmd/crane@${ver_crane}"
            # go install puts a cross-compiled binary in a GOOS_GOARCH subdirectory.
            if [ "$arch" = "$(go env GOHOSTARCH)" ]; then built="$gobin/crane"; else built="$gobin/linux_${arch}/crane"; fi
            go version -m "$built" | head -3
            install -m 0755 "$built" "${CONTEXT}/verified-binaries/linux-${arch}/crane"
          done

      - name: Resolve Trivy
        id: trivy
        env:
          CONTEXT: ${{ env.CONTEXT }}
        run: |
          set -euo pipefail
          CONTEXT="${CONTEXT}"
          COSIGN_BIN="${CONTEXT}/verified-binaries/linux-amd64/cosign"

          # Pinned by version and by the sha256 of each tarball; it used to
          # resolve releases/latest, so the image got whatever was newest on
          # the day of the build. See "Pinned components" in AGENTS.md before
          # bumping, and bump the self-check's scanner (self-checks.yml) with
          # it: that one must be no older than this.
          #
          # v0.76.2 (2026-11-05) replaced v0.75.0, which carried 7 highs
          # (stdlib x4, x/net v0.59.0 x2, go-jose v4.1.5). v0.76.2 is built
          # with go1.27.3, x/net v0.62.0 and go-jose v4.1.6 and ships none.
          # Pinned at 4 days old, an exception to the three-week rule: v0.76.0,
          # the newest release old enough, still carries 3.
          ver_trivy=v0.76.2
          sha_trivy_amd64=bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
          sha_trivy_arm64=ab9d51f86e6a5fb936f605faff6b593ac51bc378fff4d3e8b9d58358b9c367c3
          echo "ver_trivy=$ver_trivy" >> "$GITHUB_OUTPUT"

          for arch in amd64 arm64; do
            case "$arch" in
              amd64)
                TARBALL="trivy_${ver_trivy#v}_Linux-64bit.tar.gz"
                ;;
              arm64)
                TARBALL="trivy_${ver_trivy#v}_Linux-ARM64.tar.gz"
                ;;
            esac

            echo "Downloading Trivy for $arch: $TARBALL"
            curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/${ver_trivy}/${TARBALL}" -o "${TARBALL}"

            expected_var="sha_trivy_${arch}"
            echo "${!expected_var}  ${TARBALL}" | sha256sum -c -

            # Signed by Trivy's release workflow at the pinned tag; any
            # workflow in the repository at any ref used to pass. v0.75.0
            # publishes Sigstore bundles only, so the .sig/.pem pair that was
            # tried first is gone.
            curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/${ver_trivy}/${TARBALL}.sigstore.json" -o "${TARBALL}.sigstore.json"
            "$COSIGN_BIN" verify-blob "${TARBALL}" \
              --bundle "${TARBALL}.sigstore.json" \
              --certificate-identity-regexp "^https://github\.com/aquasecurity/trivy/\.github/workflows/reusable-release\.yaml@refs/tags/${ver_trivy//./\\.}\$" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

            tar -xzf "${TARBALL}" trivy
            install -m 0755 trivy "${CONTEXT}/verified-binaries/linux-${arch}/trivy"
          done

      # The vulnerability databases are deliberately NOT baked in. They used to
      # be, at ~2.8 GB of image, and going stale forced a full re-pull. They
      # now come from the shared host cache that Makefile.scanners mounts,
      # updated incrementally by `make sec/db/update`.
      #
      # The misconfiguration checks are a different matter: they are a few MB
      # of Rego policies that `trivy config` needs, they change rarely, and
      # they have no incremental mechanism. Those stay in the image.
      - name: Download Trivy misconfiguration checks
        id: trivy-checks
        env:
          CONTEXT: ${{ env.CONTEXT }}
        run: |
          set -euo pipefail
          CONTEXT="${CONTEXT}"
          TRIVY_BIN="${CONTEXT}/verified-binaries/linux-amd64/trivy"
          TRIVY_DB_DIR="${CONTEXT}/verified-binaries/trivy-db"

          # Pinned by manifest digest, like the binaries. This used to fetch
          # whatever the major-version tag pointed at, with every error thrown
          # away -- and Trivy does not fail when the download does: it logs
          # "Falling back to embedded checks" and exits 0, so the image could
          # ship without the bundle and nothing would say so.
          #
          # trivy-checks 2.2.0 (published 2026-03-17), the major version Trivy v0.75 asks
          # for. Its releases are not signed, so the digest is the check.
          # Bump with: crane digest ghcr.io/aquasecurity/trivy-checks:<version>
          checks_ref=ghcr.io/aquasecurity/trivy-checks@sha256:b63166ca02aa09e30a5127320384d7bd0d2760dc19bab3ab7041a6070114ba45

          mkdir -p "$TRIVY_DB_DIR"
          "$TRIVY_BIN" --cache-dir "$TRIVY_DB_DIR" fs /dev/null --scanners misconfig \
            --checks-bundle-repository "$checks_ref" > /dev/null 2> checks.log || true
          if grep -q "Falling back to embedded checks" checks.log \
             || [ ! -d "$TRIVY_DB_DIR/policy/content/policies" ] \
             || [ "$(jq -r .Digest "$TRIVY_DB_DIR/policy/metadata.json")" != "${checks_ref#*@}" ]; then
            cat checks.log
            echo "::error::The pinned Trivy checks bundle was not installed"
            exit 1
          fi

          # Fail loudly rather than shipping an image whose vulnerability
          # databases were pulled in by accident.
          if [ -f "$TRIVY_DB_DIR/db/trivy.db" ] || [ -f "$TRIVY_DB_DIR/java-db/trivy-java.db" ]; then
            echo "::error::Vulnerability databases must not be baked into the image"
            exit 1
          fi

          echo "Checks bundled: $(du -sh "$TRIVY_DB_DIR" | cut -f1)"

      # The helper applies incremental database updates on the client. It is
      # published as a public OCI artifact by the database pipeline, whose
      # repository stays private: on GitHub a package's visibility is
      # independent of its repository's, so the artifacts are anonymously
      # pullable while the source is not. No token is needed here, and none is
      # needed by developers at scan time either.
      - name: Fetch database helper
        id: db-helper
        env:
          HELPER_PKG: ghcr.io/avarko/trivy-incremental-dbs
          CONTEXT: ${{ env.CONTEXT }}
        run: |
          set -euo pipefail
          CONTEXT="${CONTEXT}"
          CRANE="${CONTEXT}/verified-binaries/linux-amd64/crane"
          COSIGN_BIN="${CONTEXT}/verified-binaries/linux-amd64/cosign"

          # The newest helper-v* tag, resolved to a concrete version, which is
          # passed to the build as HELPER_VER and ends up as an image label:
          # the build log expires and cannot be read from a developer's
          # terminal, so the version has to travel with the image.
          version=$("$CRANE" ls "$HELPER_PKG" | grep -E '^helper-v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "helper_version=$version" >> "$GITHUB_OUTPUT"
          echo "Using database helper $version"

          # Verified by signature, like every other binary in the image, and
          # everything after is read by the digest that was verified. The
          # checksums.txt below used to be the only check, but it ships in the
          # same archive as the binaries, so it proved the archive unpacked
          # intact and nothing about who made it. This binary decides which
          # database every scan runs against, and checks the databases'
          # signatures itself, so it is the last one to take on trust.
          # Helpers before helper-v1.2.4 were published unsigned.
          #
          # The identity alone does not name the version: a dispatched release
          # is signed as release-helper.yml on main, whatever it released. So
          # an older signed helper copied to a higher helper-v* tag would pass
          # it and ship as the newest. Since helper-v1.3.2 the signature
          # carries release=<tag>, and the version is required to match; the
          # binary's own version stamp is checked below too.
          digest=$("$CRANE" digest "${HELPER_PKG}:${version}")
          "$COSIGN_BIN" verify \
            --certificate-identity-regexp "^https://github\.com/Avarko/trivy-incremental-dbs/\.github/workflows/release-helper\.yml@refs/(tags/${version//./\\.}|heads/main)\$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            -a "release=${version}" \
            "${HELPER_PKG}@${digest}" > /dev/null
          echo "Helper signature verified: ${digest}"

          # These are OCI artifacts rather than container images, so pull the
          # layer blob directly instead of exporting a filesystem.
          workdir=$(mktemp -d)
          layer=$("$CRANE" manifest "${HELPER_PKG}@${digest}" \
            | jq -r '.layers[] | select(.mediaType | startswith("application/vnd.evolver.trivy.helper")) | .digest')
          "$CRANE" blob "${HELPER_PKG}@${layer}" | tar -xz -C "$workdir"

          # The signature covers the manifest, which names the layer by its
          # digest, so the archive is already bound to it; the checksums are
          # what tie each binary to the archive.
          for arch in amd64 arm64; do
            dest="${CONTEXT}/verified-binaries/linux-${arch}"
            mkdir -p "$dest"
            install -m 0755 "${workdir}/trivy-db-helper-linux-${arch}" "${dest}/trivy-db-helper"

            expected=$(grep "trivy-db-helper-linux-${arch}\$" "${workdir}/checksums.txt" | awk '{print $1}')
            actual=$(sha256sum "${dest}/trivy-db-helper" | awk '{print $1}')
            if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
              echo "::error::Checksum mismatch for linux-${arch} database helper"
              exit 1
            fi
          done

          rm -rf "$workdir"
          echo "Helper checksums verified"

          # The version the binary was built as, not only the tag it was
          # found under. The runner is amd64, so that one can be run.
          reported=$("${CONTEXT}/verified-binaries/linux-amd64/trivy-db-helper" -command version)
          reported=${reported%%$'\n'*}
          case "$reported" in
            *"${version}"*) echo "Helper reports $reported" ;;
            *) echo "::error::helper tagged ${version} reports '${reported}'"; exit 1 ;;
          esac

      - name: Resolve TruffleHog
        id: trufflehog
        env:
          CONTEXT: ${{ env.CONTEXT }}
        run: |
          set -euo pipefail
          CONTEXT="${CONTEXT}"
          COSIGN_BIN="${CONTEXT}/verified-binaries/linux-amd64/cosign"

          # Pinned by version and by the sha256 of each tarball, like the other
          # tools; see "Pinned components" in AGENTS.md before bumping.
          #
          # The release binaries are UPX-packed, which hides Go's build info:
          # `go version -m` cannot read them and Trivy reports nothing for
          # them, so the self-check's scan of the image is blind to this one.
          # Unpack a copy with `upx -d` to check a candidate (AGENTS.md).
          #
          # v3.99.9 (2026-11-12) replaced v3.99.8, whose go-jose v4.1.4 and
          # x/net v0.60.0 were high (CVE-2026-116587, CVE-2026-78661). v3.99.9
          # is built with go1.27.4 with go-jose v4.1.6 and x/net v0.62.0, and
          # unpacked Trivy finds no fixed high or critical in it. Pinned at
          # one day old, an exception to the three-week rule for that reason,
          # as v3.99.8 was.
          ver_trufflehog=v3.99.9
          sha_trufflehog_amd64=12050095c8063bf4d34f9f6cbce6ba9fa8d0deea9d503d0570364feba093658e
          sha_trufflehog_arm64=778b1913196dc9b9234e8fd366f64387efeb08c01930a1d2110dcb2ffd07e68b
          echo "ver_trufflehog=$ver_trufflehog" >> "$GITHUB_OUTPUT"

          CHECKSUMS="trufflehog_${ver_trufflehog#v}_checksums.txt"
          base="https://github.com/trufflesecurity/trufflehog/releases/download/${ver_trufflehog}"
          curl -fsSL "${base}/${CHECKSUMS}" -o "${CHECKSUMS}"

          # Signed by upstream's release workflow at this very tag, not by any
          # workflow in the repository, which is all the old pattern required.
          identity="^https://github\.com/trufflesecurity/trufflehog/\.github/workflows/release\.yml@refs/tags/${ver_trufflehog//./\\.}\$"

          # A Sigstore bundle when the release has one; cosign has deprecated
          # the separate --certificate/--signature pair and will drop it.
          # v3.99.2 still ships only .sig and .pem, so the pair stays as the
          # fallback until upstream publishes bundles.
          if curl -fsSL "${base}/${CHECKSUMS}.sigstore.json" -o "${CHECKSUMS}.sigstore.json" 2>/dev/null; then
            "$COSIGN_BIN" verify-blob "${CHECKSUMS}" \
              --bundle "${CHECKSUMS}.sigstore.json" \
              --certificate-identity-regexp "$identity" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          else
            curl -fsSL "${base}/${CHECKSUMS}.sig" -o "${CHECKSUMS}.sig"
            curl -fsSL "${base}/${CHECKSUMS}.pem" -o "${CHECKSUMS}.pem"
            "$COSIGN_BIN" verify-blob "${CHECKSUMS}" \
              --certificate "${CHECKSUMS}.pem" \
              --signature "${CHECKSUMS}.sig" \
              --certificate-identity-regexp "$identity" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          fi

          # Both architectures, each checked against the signed checksums and
          # against the pinned hash.
          for arch in amd64 arm64; do
            TARBALL="trufflehog_${ver_trufflehog#v}_linux_${arch}.tar.gz"
            echo "Downloading TruffleHog for $arch: $TARBALL"
            curl -fsSL "https://github.com/trufflesecurity/trufflehog/releases/download/${ver_trufflehog}/${TARBALL}" -o "${TARBALL}"

            sha256sum --ignore-missing -c "${CHECKSUMS}"
            expected_var="sha_trufflehog_${arch}"
            echo "${!expected_var}  ${TARBALL}" | sha256sum -c -

            tar -xzf "${TARBALL}" trufflehog
            install -m 0755 trufflehog "${CONTEXT}/verified-binaries/linux-${arch}/trufflehog"
          done

      # Semgrep is Python: the semgrep wheel and every dependency's, from PyPI,
      # each checked against the hashes in cli/semgrep/requirements.txt
      # (--require-hashes). Wheels only, so no package's build code runs here,
      # and no resolution either: the file is the complete set (--no-deps).
      # pip selects wheels for the image's interpreter and each architecture
      # rather than the runner's, and installs them without running them.
      #
      # pip matches --platform literally, without the older manylinux tags a
      # newer glibc also accepts, so each one up to the image's is listed.
      # The wheels ask for 2.34 at most; Wolfi's glibc is newer.
      #
      # The two commands pip writes name the runner's Python in their #! line,
      # so it is replaced with the image's. The bytecode Python would cache is
      # not built here (--no-compile): this runner's Python is a different
      # version, and the image sets PYTHONDONTWRITEBYTECODE instead.
      #
      # semgrep-core in the PyPI wheels keeps the directory it was built in,
      # /src/semgrep-pro/..., ahead of $ORIGIN/libs in its RUNPATH, and the
      # loader looks there first for every library, libc included. Whatever is
      # mounted at /src could supply them, so the search path is cut back to
      # the libraries the wheel ships, and any ELF file here whose search path
      # reaches outside the Semgrep tree fails the build.
      #
      # Bumping: requirements.in, then `make image/semgrep-lock`; see "Pinned
      # components" in AGENTS.md. 1.185.0 (2026-11-10) adds structlog to the
      # dependencies; Trivy finds no fixed high or critical in it or in 1.180.0.
      # Before it, 1.180.0 was the version the image and CI's
      # Semgrep action already ran (it had its own image until now).
      - name: Install Semgrep
        id: semgrep
        env:
          CONTEXT: ${{ env.CONTEXT }}
        run: |
          set -euo pipefail
          req="${CONTEXT}/semgrep/requirements.txt"
          ver_semgrep=$(sed -n 's/^semgrep==\([0-9][0-9.]*\) .*$/\1/p' "$req")
          if [ -z "$ver_semgrep" ]; then
            echo "::error::No semgrep== line in $req" >&2
            exit 1
          fi
          echo "ver_semgrep=v${ver_semgrep}" >> "$GITHUB_OUTPUT"
          python3 -m pip --version

          for arch in amd64 arm64; do
            case "$arch" in
              amd64) machine=x86_64 ;;
              arm64) machine=aarch64 ;;
            esac
            platforms=()
            for minor in $(seq 17 34); do
              platforms+=(--platform "manylinux_2_${minor}_${machine}")
            done

            out="${CONTEXT}/verified-binaries/linux-${arch}"
            site="${out}/semgrep-site"
            python3 -m pip install --disable-pip-version-check --no-cache-dir \
              --target "$site" "${platforms[@]}" \
              --python-version 3.14 --implementation cp --abi cp314 \
              --only-binary=:all: --no-deps --no-compile --require-hashes \
              -r "$req"

            for cmd in semgrep pysemgrep; do
              sed '1s|^#!.*$|#!/usr/bin/python3.14|' "${site}/bin/${cmd}" > "${out}/${cmd}"
              chmod 0755 "${out}/${cmd}"
            done
            rm -r "${site}/bin"

            core="${site}/semgrep/bin/semgrep-core"
            # shellcheck disable=SC2016  # $ORIGIN is for the loader, not the shell
            patchelf --set-rpath '$ORIGIN/libs' "$core"
            file "$core"

            # Every RPATH/RUNPATH entry of every ELF file, each line and each
            # field, empty ones included (the loader reads an empty entry as
            # the working directory, which is the scanned repository), must
            # resolve inside the Semgrep tree; $ORIGIN/.. that climbs out of it
            # fails like an absolute path. A NEEDED entry naming a path rather
            # than a library is refused too, and so is a search path line that
            # does not parse. readelf is outside a pipeline, so a file it
            # cannot open fails the step instead of passing.
            site_abs=$(realpath "$site")
            bad=0
            while IFS= read -r -d '' f; do
              [ "$(head -c 4 "$f" | od -An -c | tr -d ' ')" = '177ELF' ] || continue
              rel="${f#"${site}/"}"
              dir=$(dirname "$f")
              dyn=$(readelf -d "$f")
              while IFS= read -r entry; do
                case "$entry" in
                  '$ORIGIN') resolved=$(realpath -m "$dir") ;;
                  '$ORIGIN/'*) resolved=$(realpath -m "${dir}/${entry#'$ORIGIN/'}") ;;
                  *) resolved="" ;;
                esac
                case "$resolved" in
                  "$site_abs"|"$site_abs"/*) ;;
                  *) echo "::error::${rel} searches '${entry}' for libraries" >&2; bad=1 ;;
                esac
              done < <(printf '%s\n' "$dyn" \
                | sed -n '/(R[UN]*PATH)/{s/^[^[]*\[\(.*\)\]$/\1/p;t;s/.*/<unparsed>/p}' \
                | tr ':' '\n')
              if grep -q '(NEEDED).*\[.*/.*\]' <<< "$dyn"; then
                echo "::error::${rel} names a library by path" >&2; bad=1
              fi
            done < <(find "$site" -type f -print0)
            [ "$bad" -eq 0 ]
          done

      # A tarball rather than the directory: artifacts drop file modes, and
      # these are executables.
      - name: Hand the verified binaries to the build jobs
        id: handoff
        env:
          CONTEXT: ${{ env.CONTEXT }}
        run: |
          set -euo pipefail
          tar -C "${CONTEXT}" -czf verified-binaries.tgz verified-binaries
          echo "sha256=$(sha256sum verified-binaries.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: verified-binaries
          path: verified-binaries.tgz
          retention-days: 1
          if-no-files-found: error

  # The operating system layer: Wolfi packages at the versions cli/apko.lock.json
  # fixes, assembled by apko and published for the build jobs to start FROM.
  # apko unpacks packages rather than running them, so one amd64 job builds
  # both architectures without an emulator. The same config and lockfile give
  # the same bytes, so the tag is a hash of exactly those inputs, and a run
  # that changed none of them republishes the image that is already there.
  base:
    name: Build the OS layer
    if: github.repository == 'Avarko/gh-security-toolkit'
    needs: [prepare]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write       # push the base to GHCR
    outputs:
      ref: ${{ steps.publish.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: verified-binaries

      # cosign checks apko's signature below and crane reads the published
      # digest back, so both come from what prepare verified.
      - name: Unpack the verified binaries
        env:
          CONTEXT: ${{ env.CONTEXT }}
          SHA256: ${{ needs.prepare.outputs.binaries_sha256 }}
        run: |
          set -euo pipefail
          echo "${SHA256}  verified-binaries.tgz" | sha256sum -c -
          tar -C "${CONTEXT}" -xzf verified-binaries.tgz && rm verified-binaries.tgz

      # Pinned by version and sha256 like every other tool here, and the
      # pinned hash is also checked against checksums.txt as Chainguard's
      # release workflow signed it. v1.5.0 (2026-11-12) replaced v1.4.11, built
      # with go1.27.0 and carrying six highs (x/net v0.59.0 and the Go 1.27.0
      # stdlib); v1.5.0 is built with go1.27.4 and Trivy finds none. Pinned
      # at one day old, an exception to the three-week rule for that reason.
      - name: Install apko
        env:
          CONTEXT: ${{ env.CONTEXT }}
        run: |
          set -euo pipefail
          ver_apko=v1.5.0
          sha_apko_amd64=611cd21aad41dbef2a2698087ebfbb308ba6b0f171797e5571033fb6622ba708
          tarball="apko_${ver_apko#v}_linux_amd64.tar.gz"
          url="https://github.com/chainguard-dev/apko/releases/download/${ver_apko}"
          for f in checksums.txt checksums.txt.crt checksums.txt.sig "${tarball}"; do
            curl -fsSL -o "${f}" "${url}/${f}"
          done
          echo "${sha_apko_amd64}  ${tarball}" | sha256sum -c -
          "${CONTEXT}/verified-binaries/linux-amd64/cosign" verify-blob checksums.txt \
            --certificate checksums.txt.crt --signature checksums.txt.sig \
            --certificate-identity=https://github.com/chainguard-dev/apko/.github/workflows/release.yaml@refs/heads/main \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com
          grep -qxF "${sha_apko_amd64}  ${tarball}" checksums.txt
          tar -xzf "${tarball}" "apko_${ver_apko#v}_linux_amd64/apko"
          install -m 0755 "apko_${ver_apko#v}_linux_amd64/apko" /usr/local/bin/apko
          apko version

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # apko refuses a lockfile whose recorded config checksum does not match
      # apko.yaml, so a package added without regenerating the lock fails
      # here rather than being resolved to whatever is newest.
      - name: Publish the base
        id: publish
        env:
          CONTEXT: ${{ env.CONTEXT }}
          REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-base
        run: |
          set -euo pipefail
          cd "${CONTEXT}"
          inputs=$(cat apko.yaml apko.lock.json wolfi-signing.rsa.pub | sha256sum | cut -c1-16)
          apko publish apko.yaml "${REPO}:lock-${inputs}" \
            --lockfile apko.lock.json --arch x86_64,aarch64 --sbom=false
          digest=$(verified-binaries/linux-amd64/crane digest "${REPO}:lock-${inputs}")
          case "${digest}" in
            sha256:*) ;;
            *) echo "::error::crane returned no digest for ${REPO}:lock-${inputs}" >&2; exit 1 ;;
          esac
          echo "ref=${REPO}@${digest}" >> "$GITHUB_OUTPUT"
          echo "Base: ${REPO}@${digest}"

  build:
    name: Build ${{ matrix.arch }}
    if: github.repository == 'Avarko/gh-security-toolkit'
    needs: [prepare, base]
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write       # push to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: verified-binaries

      # Checked against the hash prepare recorded, so the build uses exactly
      # what was verified there.
      - name: Unpack the verified binaries
        env:
          CONTEXT: ${{ env.CONTEXT }}
          SHA256: ${{ needs.prepare.outputs.binaries_sha256 }}
        run: |
          set -euo pipefail
          echo "${SHA256}  verified-binaries.tgz" | sha256sum -c -
          tar -C "${CONTEXT}" -xzf verified-binaries.tgz && rm verified-binaries.tgz

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # BuildKit runs every build step, so its image is pinned by digest like
      # anything else that does: buildx-stable-1 is a moving tag. This is the
      # digest it resolved to on 2026-10-12 (BuildKit v0.33.1).
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          driver-opts: image=moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      # The same tag list as the merge job, though no tag is pushed here:
      # metadata-action derives org.opencontainers.image.version from it, and
      # the label has to name the release the image is tagged as.
      - name: Extract labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.inputs.docker-image-tag }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      # Pushed by digest, untagged: the tags go on the multi-arch index in
      # the merge job, so no tag ever points at one architecture alone.
      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BASE=${{ needs.base.outputs.ref }}
            TRIVY_VER=${{ needs.prepare.outputs.ver_trivy }}
            TRUFFLEHOG_VER=${{ needs.prepare.outputs.ver_trufflehog }}
            COSIGN_VER=${{ needs.prepare.outputs.ver_cosign }}
            CRANE_VER=${{ needs.prepare.outputs.ver_crane }}
            HELPER_VER=${{ needs.prepare.outputs.helper_version }}
            SEMGREP_VER=${{ needs.prepare.outputs.ver_semgrep }}
          # No layer cache: what is built here is a handful of COPYs onto
          # a base that arrives by digest, so there is nothing worth caching.

      # Runs the image just pushed, on its own architecture: arm64 is
      # otherwise never executed before it is tagged. Semgrep is the one tool
      # here with an interpreter, #! lines and bundled libraries to get wrong.
      - name: Smoke test
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker run --rm "$IMAGE" semgrep --version
          # As scans run it: the host's uid, HOME=/tmp.
          docker run --rm --user 12345:12345 -e HOME=/tmp "$IMAGE" semgrep --version
          docker run --rm "$IMAGE" pysemgrep --version
          docker run --rm "$IMAGE" trivy --version

      # A matrix job's outputs overwrite each other, so each digest travels
      # as a file of its own.
      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p digests
          echo "${DIGEST}" > "digests/${ARCH}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}
          retention-days: 1
          if-no-files-found: error

  merge:
    name: Tag multi-arch image
    if: github.repository == 'Avarko/gh-security-toolkit'
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write       # push to GHCR
    outputs:
      image_ref: ${{ steps.index.outputs.image_ref }}
      image_digest: ${{ steps.index.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest only moves for builds from the default branch. A build from
          # a feature branch would otherwise repoint the tag every other
          # project pulls, which is not what testing a branch should do.
          tags: |
            type=raw,value=${{ github.event.inputs.docker-image-tag }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Create and push the multi-arch index
        id: index
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          if [ ! -s digests/amd64 ] || [ ! -s digests/arm64 ]; then
            echo "::error::a platform digest is missing"
            exit 1
          fi

          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=(-t "$tag")
          done <<< "$TAGS"

          docker buildx imagetools create "${tag_args[@]}" \
            "${IMAGE}@$(cat digests/amd64)" \
            "${IMAGE}@$(cat digests/arm64)"

          first_tag=$(head -n1 <<< "$TAGS")
          digest=$(docker buildx imagetools inspect "$first_tag" --format '{{json .Manifest}}' | jq -r .digest)
          case "$digest" in sha256:*) ;; *) echo "::error::no index digest for $first_tag"; exit 1 ;; esac

          # The index read back must be the one just made: exactly the two
          # platform images this run built. Everything downstream attests it.
          got=$(docker buildx imagetools inspect --raw "${IMAGE}@${digest}" | jq -r '.manifests[].digest' | sort)
          want=$(sort digests/amd64 digests/arm64)
          if [ "$got" != "$want" ]; then
            echo "::error::${first_tag} does not point at this run's images"
            exit 1
          fi
          docker buildx imagetools inspect "${IMAGE}@${digest}"

          echo "image_ref=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  sbom:
    name: Generate SBOM and attestation
    if: github.repository == 'Avarko/gh-security-toolkit'
    needs: [merge]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write      # push SBOM to GHCR
      id-token: write      # OIDC for signing
      attestations: write  # GitHub Attestations store
    steps:
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: ${{ needs.merge.outputs.image_ref }}@${{ needs.merge.outputs.image_digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      # attest-sbom is deprecated; attest takes the SBOM itself.
      - name: Generate SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ needs.merge.outputs.image_ref }}
          subject-digest: ${{ needs.merge.outputs.image_digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
          # The storage record only feeds the organization's linked-artifacts
          # view, and needs a permission (artifact-metadata) this workflow
          # does not ask for; trying anyway just logs a warning.
          create-storage-record: false

  # Build provenance (SLSA v1), signed by this workflow, kept in GitHub's
  # attestation store and pushed next to the image in GHCR.
  #
  # This used to be done twice. slsa-github-generator wrote a second, SLSA
  # v0.2 provenance as a cosign .att, which nothing outside this workflow
  # read, and it was the build's largest set of moving parts: a builder
  # binary fetched at run time, a bootstrap cosign v2.2.3 checked without its
  # transparency log, Node 20 actions. What it added was the "Build L3"
  # label, for signing in a reusable workflow the caller cannot reach. Here
  # that buys little: the build jobs hold no id-token, so they cannot sign
  # anything, and whoever can change this file could change the call too.
  provenance:
    name: Generate build provenance
    if: github.repository == 'Avarko/gh-security-toolkit'
    needs: [merge]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write      # push the attestation to GHCR
      id-token: write      # OIDC for signing
      attestations: write  # GitHub Attestations store
    steps:
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # With no SBOM or predicate given, attest generates SLSA provenance.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ needs.merge.outputs.image_ref }}
          subject-digest: ${{ needs.merge.outputs.image_digest }}
          push-to-registry: true
          # See the SBOM attestation.
          create-storage-record: false

  verify_github_store:
    name: Verify attestations
    if: github.repository == 'Avarko/gh-security-toolkit'
    needs: [merge, provenance, sbom]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify attestations via GH CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEEDS_BUILD_IMAGE_DIGEST: ${{ needs.merge.outputs.image_digest }}
          NEEDS_BUILD_IMAGE_REF: ${{ needs.merge.outputs.image_ref }}
        run: |
          # Use oci:// prefix for container images
          SUBJECT="oci://${NEEDS_BUILD_IMAGE_REF}@${NEEDS_BUILD_IMAGE_DIGEST}"

          echo "Verifying attestations for: $SUBJECT"

          set -euo pipefail
          # Both attestations, each signed by this workflow in this
          # repository. Without --predicate-type only SLSA provenance is
          # checked, and --owner alone accepts any workflow in the org.
          # Both copies too: the one in GitHub's store, and the one in GHCR
          # next to the image, which is what a consumer without access to
          # the store finds.
          signer="${GITHUB_REPOSITORY}/.github/workflows/int-manual-build-scanner-cli.yml"
          for predicate in https://slsa.dev/provenance/v1 https://spdx.dev/Document/v2.3; do
            for from in "" --bundle-from-oci; do
              gh attestation verify "$SUBJECT" \
                --repo "${GITHUB_REPOSITORY}" \
                --signer-workflow "$signer" \
                --predicate-type "$predicate" \
                ${from:+"$from"} > /dev/null
              echo "verified: $predicate ${from:-(GitHub store)}"
            done
          done