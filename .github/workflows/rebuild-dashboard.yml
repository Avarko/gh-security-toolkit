name: Rebuild Dashboard (Test)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel to rebuild dashboard for'
        type: string
        required: true
        default: 'main'

      # For testing, allow using a specific scan timestamp
      scan_timestamp:
        description: 'Specific scan timestamp (leave empty to use latest from history)'
        type: string
        required: false
        default: ''

jobs:
  rebuild-dashboard:
    name: Rebuild Dashboard Only
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JBang
        uses: jbangdev/setup-jbang@main

      - name: Generate timestamp
        id: ts
        run: |
          if [ -n "${{ inputs.scan_timestamp }}" ]; then
            echo "ts=${{ inputs.scan_timestamp }}" >> "$GITHUB_OUTPUT"
            echo "Using provided timestamp: ${{ inputs.scan_timestamp }}"
          else
            echo "ts=$(date -u +'%Y-%m-%d-%H%M%SZ')" >> "$GITHUB_OUTPUT"
            echo "Generated new timestamp"
          fi

      - name: Create minimal scan data
        id: setup
        run: |
          # Create a minimal output directory with empty scan results
          # This is needed because the publisher expects these files
          mkdir -p scan-output
          echo '{"Results":[]}' > scan-output/trivy-fs-results.json
          echo '{"results":[]}' > scan-output/semgrep-results.json

          # Generate realistic scan history with 20 nightly scans showing security improvement
          ./scripts/generate-test-scan-history.sh scan-output/scan-history.json "${{ inputs.channel }}"

          echo "output_dir=scan-output" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Pages
        id: pages
        uses: Avarko/gh-security-toolkit/actions/publisher/github-pages@reactui
        with:
          github_token: ${{ github.token }}
          outdir: ${{ steps.setup.outputs.output_dir }}
          metadata_timestamp: ${{ steps.ts.outputs.ts }}
          metadata_branch: ${{ github.ref_name }}
          metadata_repository: ${{ github.repository }}
          metadata_commit_sha: ${{ github.sha }}
          metadata_scan_id: ${{ github.run_id }}
          channel: ${{ inputs.channel }}
          pages_root: docs
          retention_keep: 10
          retention_days: 30
          ci_job_name: ${{ github.workflow }}
          ci_job_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Summary
        run: |
          echo "## 🎨 Dashboard Rebuild Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Channel**: ${{ inputs.channel }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Timestamp**: ${{ steps.ts.outputs.ts }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Pages URL**: ${{ steps.pages.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The React+Remix dashboard has been built and deployed." >> "$GITHUB_STEP_SUMMARY"
          echo "All existing scan history has been preserved." >> "$GITHUB_STEP_SUMMARY"
