name: Rebuild Dashboard (Test)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel to rebuild dashboard for'
        type: string
        required: true
        default: 'main'

      # For testing, allow using a specific scan timestamp
      scan_timestamp:
        description: 'Specific scan timestamp (leave empty to use latest from history)'
        type: string
        required: false
        default: ''

jobs:
  rebuild-dashboard:
    name: Rebuild Dashboard Only
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JBang
        uses: jbangdev/setup-jbang@main

      - name: Generate timestamp
        id: ts
        run: echo "ts=$(date -u +'%Y-%m-%d-%H%M%SZ')" >> "$GITHUB_OUTPUT"

      - name: Create minimal scan data with context
        id: setup
        run: |
          # Create a minimal output directory with empty scan results
          mkdir -p scan-output

          # Create scan-context.json (required by publisher)
          cat > scan-output/scan-context.json << EOF
          {
            "channel": "${{ inputs.channel }}",
            "timestamp": "${{ steps.ts.outputs.ts }}",
            "branch": "${GITHUB_REF_NAME:-}",
            "repository": "${GITHUB_REPOSITORY:-}",
            "commitSha": "${GITHUB_SHA:-}",
            "scanId": "${GITHUB_RUN_ID:-}",
            "ciJobName": "${GITHUB_WORKFLOW:-}",
            "ciJobUrl": "${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "actorName": "${GITHUB_ACTOR:-}"
          }
          EOF

          echo '{"Results":[]}' > scan-output/trivy-fs-results.json
          echo '{"results":[]}' > scan-output/semgrep-results.json

          # Generate realistic scan history with 20 nightly scans showing security improvement
          ./scripts/generate-test-scan-history.sh scan-output/scan-history.json "${{ inputs.channel }}"

          echo "output_dir=scan-output" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Pages
        id: pages
        uses: Avarko/gh-security-toolkit/actions/publisher/github-pages@main
        with:
          github_token: ${{ github.token }}
          outdir: ${{ steps.setup.outputs.output_dir }}

      - name: Summary
        run: |
          echo "## 🎨 Dashboard Rebuild Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Channel**: ${{ inputs.channel }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Pages URL**: ${{ steps.pages.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The React+Remix dashboard has been built and deployed." >> "$GITHUB_STEP_SUMMARY"
          echo "All existing scan history has been preserved." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Note**: Timestamp is now auto-generated by the publisher action." >> "$GITHUB_STEP_SUMMARY"
